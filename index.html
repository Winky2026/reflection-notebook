<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="复盘自己" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F7F7F8" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>复盘自己</title>
  <style>
    /* =========================================================
       极简静谧色盘：纸感浅灰白 + 炭黑锚点 + 雾靛蓝默认连线
       ========================================================= */
    :root {
      --bg-canvas: #F7F7F8;
      --bg-card: #FFFFFF;
      --bg-subtle: #F0F1F4;
      --bg-pill-active: #EFEFF2;
      --text-primary: #16171A;
      --text-secondary: #8A8E99;
      --text-tertiary: #C1C4CD;
      --border-hairline: rgba(22, 23, 26, 0.06);
      --border-soft: rgba(22, 23, 26, 0.1);
      --shadow-card: 0 2px 10px rgba(17, 18, 20, 0.028), 0 1px 2px rgba(17, 18, 20, 0.018);
      --shadow-dock: 0 10px 30px rgba(17, 18, 20, 0.075), 0 2px 8px rgba(17, 18, 20, 0.035);
      --shadow-fab: 0 10px 24px rgba(22, 23, 26, 0.22), 0 2px 6px rgba(22, 23, 26, 0.12);

      --ink-accent: #3B76B8;
      --ink-accent-soft: rgba(59, 118, 184, 0.11);
      --ink-sage: #3EA37E;
      --ink-clay: #D4886A;
      --ink-plum: #7D6EB8;

      --radius-card: 20px;
      --radius-icon: 13px;
      --radius-pill: 999px;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #ECEEF2;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    input, textarea, select {
      font-family: inherit;
    }

    .viewport-shell {
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }
    .app-frame {
      width: 100%;
      max-width: 412px;
      height: min(852px, calc(100dvh - 40px));
      background: var(--bg-canvas);
      border-radius: 40px;
      box-shadow: 0 24px 70px rgba(17, 18, 20, 0.12), 0 0 0 1px rgba(22, 23, 26, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      body { background: var(--bg-canvas); }
      .viewport-shell { padding: 0; display: block; height: 100dvh; }
      .app-frame { max-width: none; height: 100dvh; border-radius: 0; box-shadow: none; }
      .status-bar { display: none !important; }
    }

    .status-bar {
      height: 44px; padding: 14px 26px 0; display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; color: var(--text-primary); flex-shrink: 0; user-select: none;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    .cloud-bar { display: flex; justify-content: flex-end; padding: 0 18px; }
    .cloud-bar:has(button[hidden]) { display: none; }
    .app-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 12px 20px calc(122px + var(--safe-bottom));
      scrollbar-width: none;
    }
    .app-scroll::-webkit-scrollbar { display: none; }

    .tab-page { display: none; animation: pageFade 0.2s var(--spring); }
    .tab-page.active { display: block; }
    @keyframes pageFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; min-height: 36px;
    }
    .page-title {
      font-size: 26px; font-weight: 700; letter-spacing: -0.025em;
      line-height: 1.15; color: var(--text-primary);
    }
    .header-meta { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
    .date-picker-btn {
      border: none; background: transparent; color: var(--text-secondary);
      font-size: 13px; font-weight: 600; padding: 6px 4px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .date-picker-btn:active { color: var(--text-primary); }
    .week-nav-inline {
      display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 12.5px; font-weight: 500;
    }
    .week-nav-arrow {
      width: 28px; height: 28px; border: none; background: transparent; color: var(--text-secondary);
      border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .week-nav-arrow:active { background: #ECEEF2; color: var(--text-primary); }

    /* 7天圆环 + 极轻左右切周 */
    .week-strip-wrap {
      display: grid; grid-template-columns: 20px 1fr 20px; align-items: center; gap: 2px;
      margin: 0 -6px 22px;
    }
    .week-edge-btn {
      border: none; background: transparent; color: #B4B8C2; height: 48px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 10px;
    }
    .week-edge-btn:active { background: #ECEEF2; color: var(--text-primary); }
    .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }

    /* 月历选择抽屉 */
    .cal-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-month-nav { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 2px; }
    .cal-day {
      border: none; background: transparent; border-radius: 12px; padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    }
    .cal-day.other { opacity: 0.28; }
    .cal-day.selected { background: #FFFFFF; box-shadow: 0 2px 8px rgba(17, 18, 20, 0.06); }
    .cal-day.today .cal-day-num { color: var(--ink-accent); font-weight: 700; }
    .cal-day-num { font-size: 13px; font-weight: 500; color: var(--text-primary); line-height: 1; }
    .cal-day.selected .cal-day-num { font-weight: 700; }

    /* 月度编辑抽屉内的当月周度参考区 */
    .ref-panel {
      margin-top: 12px; background: #FFFFFF; border-radius: 14px;
      border: 1px solid var(--border-hairline); padding: 11px 12px;
    }
    .ref-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;
    }
    .ref-week-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: none; }
    .ref-week-tabs::-webkit-scrollbar { display: none; }
    .ref-wtab {
      border: 1px solid var(--border-hairline); background: #F7F7F8; color: #525661;
      font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
      white-space: nowrap; cursor: pointer;
    }
    .ref-wtab.active { background: var(--text-primary); color: #FFFFFF; border-color: var(--text-primary); }
    .ref-list { display: flex; flex-direction: column; gap: 6px; max-height: 168px; overflow-y: auto; }
    .ref-item {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      padding: 7px 8px; background: #F7F7F8; border-radius: 10px;
    }
    .ref-item-text { flex: 1; font-size: 12px; line-height: 1.45; color: #2D3038; }
    .ref-item-tag { font-size: 10px; color: var(--text-secondary); display: block; margin-bottom: 2px; }
    .ref-quote-btn {
      border: none; background: #FFFFFF; color: var(--ink-accent);
      font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--border-hairline); cursor: pointer; flex-shrink: 0;
    }
    .pill-action {
      border: none; background: #ECEEF2; color: #3C4049;
      font-size: 12.5px; font-weight: 600;
      padding: 8px 14px; border-radius: var(--radius-pill);
      cursor: pointer; transition: background 0.16s ease, transform 0.16s var(--spring);
    }
    .pill-action:active { transform: scale(0.96); }
    .pill-action.ink { background: var(--text-primary); color: #FFFFFF; }
    .pill-action.accent { background: var(--ink-accent); color: #FFFFFF; }
    .day-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 6px 2px 8px; border-radius: 15px; border: none; background: transparent; cursor: pointer;
    }
    .day-cell.selected { background: rgba(255, 255, 255, 0.96); box-shadow: 0 2px 8px rgba(17, 18, 20, 0.04); }
    .day-dow { font-size: 11px; font-weight: 600; color: var(--text-secondary); width: 22px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .day-cell.is-today .day-dow { background: #EAECEF; color: var(--text-primary); }
    .day-ring-wrap { width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; }
    .day-num { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .day-cell.is-today .day-num, .day-cell.selected .day-num { color: var(--text-primary); font-weight: 700; }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 12px; }
    .section-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
    .section-ratio { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

    /* 每日记录卡片 */
    .card-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .moment-card {
      background: var(--bg-card); border-radius: var(--radius-card); padding: 14px 15px 14px 14px;
      box-shadow: var(--shadow-card); border: 1px solid var(--border-hairline);
      display: flex; align-items: center; gap: 13px; cursor: pointer;
      transition: transform 0.2s var(--spring);
    }
    .moment-card:active { transform: scale(0.985); }
    .icon-box {
      width: 42px; height: 42px; border-radius: var(--radius-icon);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #F4F5F7;
    }
    .card-main { flex: 1; min-width: 0; }
    .card-title { font-size: 14.5px; font-weight: 600; color: var(--text-primary); line-height: 1.38; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .dot-reframed { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-accent); display: inline-block; }
    .chevron-btn { color: #CBCED6; flex-shrink: 0; display: flex; align-items: center; }

    .empty-card { background: rgba(255, 255, 255, 0.72); border: 1px dashed #DADCE3; border-radius: var(--radius-card); padding: 28px 18px; text-align: center; }
    .empty-card-title { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
    .empty-card-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }

    /* =========================================================
       单事件「当时 vs 意义重塑」双栏对照图（点击单格进入全宽16px编辑，零缩放）
       ========================================================= */
    .flow-event-box {
      background: #FFFFFF; border: 1.5px solid #222429; border-radius: 15px;
      padding: 11px 13px; margin-bottom: 2px;
    }
    .flow-event-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
    .flow-mood-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .flow-mood-chip {
      border: 1px solid var(--border-hairline); background: #F5F6F8; color: #525661;
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 3px; cursor: pointer;
    }
    .flow-mood-chip svg { width: 12px; height: 12px; }
    .flow-mood-chip.active { background: var(--text-primary); color: #FFFFFF; border-color: var(--text-primary); }
    .flow-event-edit {
      width: 100%; border: none; background: transparent; text-align: left; padding: 0;
      font-family: inherit; cursor: pointer; display: block;
    }
    .flow-q { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .flow-val { font-size: 13.5px; font-weight: 600; color: var(--text-primary); line-height: 1.45; }
    .flow-fork-svg { display: block; width: 100%; height: 24px; }
    .flow-col-heads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 7px; font-size: 11.5px; font-weight: 600; text-align: center; }
    .flow-col-heads .left-h { color: var(--text-secondary); }
    .flow-col-heads .right-h { color: var(--ink-accent); }
    .flow-grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .flow-arrow-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 15px; }
    .flow-arrow-cell { display: flex; justify-content: center; align-items: center; }

    .flow-cell {
      appearance: none; text-align: left; font-family: inherit;
      border-radius: 13px; padding: 10px 11px; background: #FFFFFF;
      display: flex; flex-direction: column; gap: 5px; cursor: pointer;
      min-height: 76px; transition: transform 0.15s var(--spring), background 0.15s ease;
    }
    .flow-cell:active { transform: scale(0.98); }
    .flow-cell.past { border: 1px solid #DCDFE6; background: #FAFAFB; }
    .flow-cell.reframe { border: 1.4px solid var(--ink-accent); background: #FFFFFF; }
    .flow-cell.result-past { border: 1px solid #C8CCD4; background: #FAFAFB; min-height: 62px; }
    .flow-cell.result-future { border: 1.4px solid #222429; background: #FFFFFF; min-height: 62px; }
    .flow-cell-tag { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); }
    .flow-cell.reframe .flow-cell-tag { color: var(--ink-accent); }
    .flow-cell-body { font-size: 12.5px; line-height: 1.48; color: var(--text-primary); word-break: break-word; }
    .flow-cell-body.placeholder { color: #B8BCC6; }

    /* =========================================================
       周度总览表
       ========================================================= */
    .mode-bar { display: grid; grid-template-columns: repeat(3, 1fr); background: #ECEEF2; padding: 3px; border-radius: 13px; gap: 3px; margin-bottom: 14px; }
    .mode-btn { border: none; background: transparent; padding: 8px 4px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
    .mode-btn.active { background: #FFFFFF; color: var(--text-primary); box-shadow: 0 2px 6px rgba(17, 18, 20, 0.06); }
    .mode-btn.ink-active { background: var(--ink-accent); color: #FFFFFF; }

    .week-board-card { background: #FFFFFF; border-radius: 16px; box-shadow: var(--shadow-card); border: 1px solid var(--border-soft); overflow: visible; position: relative; margin-bottom: 16px; }
    .week-table { width: 100%; position: relative; z-index: 1; }
    .week-row { display: grid; grid-template-columns: 44px 1fr 28px; border-bottom: 1px solid var(--border-hairline); }
    .week-row:last-child { border-bottom: none; }
    .week-date-col { background: #FAFAFB; border-right: 1px solid var(--border-hairline); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; font-size: 10.5px; font-weight: 600; color: #4A4E59; line-height: 1.25; }
    .week-row:first-child .week-date-col { border-top-left-radius: 15px; }
    .week-row:last-child .week-date-col { border-bottom-left-radius: 15px; }
    .week-date-col span { font-size: 9.5px; color: var(--text-secondary); }
    .week-items-col { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
    .week-item-row { display: flex; align-items: flex-start; gap: 6px; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
    .week-item-row.focused { background: var(--ink-accent-soft); }
    .week-item-row.link-origin { box-shadow: inset 0 0 0 1.5px var(--ink-accent); background: var(--ink-accent-soft); }
    .week-check-mark { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #9095A0; margin-top: 1px; }
    .week-item-row.focused .week-check-mark { border: 1.4px solid var(--ink-accent); color: var(--ink-accent); background: #FFFFFF; }
    .week-item-text { font-size: 12px; line-height: 1.45; color: var(--text-primary); }
    .svg-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
    .summary-block { background: #FFFFFF; border-radius: 16px; padding: 14px 15px; box-shadow: var(--shadow-card); border: 1px solid var(--border-hairline); margin-bottom: 10px; cursor: pointer; transition: transform 0.16s var(--spring); }
    .summary-block:active { transform: scale(0.988); }
    .summary-top-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: var(--ink-accent); font-weight: 600; }
    .summary-bracket { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
    .summary-body { font-size: 12.5px; line-height: 1.6; color: #525661; white-space: pre-line; }
    .summary-plan {
      margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border-hairline);
      display: flex; flex-wrap: wrap; gap: 5px 10px; font-size: 11.5px; color: #4A4E59; line-height: 1.45;
    }
    .summary-plan strong { color: var(--text-primary); font-weight: 600; }

    /* 抽象化三阶段八层级 & 4W1H+预算 极简表单 */
    .stage-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #ECEEF2; padding: 3px; border-radius: 11px; gap: 3px; margin: 6px 0 8px; }
    .stage-tab { border: none; background: transparent; padding: 6px 2px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
    .stage-tab.active { background: #FFFFFF; color: var(--text-primary); box-shadow: 0 1px 4px rgba(17, 18, 20, 0.06); }
    .level-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .level-chip {
      border: 1px solid var(--border-hairline); background: #FFFFFF; color: #4A4E59;
      font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    }
    .level-chip.active { background: var(--ink-accent); color: #FFFFFF; border-color: var(--ink-accent); }
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 6px; }
    .plan-grid .full { grid-column: span 2; }
    .plan-field-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; display: block; }
    .plan-grid .soft-input { font-size: 13px; padding: 8px 10px; border-radius: 10px; }
    .collapse-link {
      border: none; background: transparent; color: var(--ink-accent); font-size: 12.5px;
      font-weight: 600; padding: 8px 0 2px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .sheet-head-actions { display: flex; align-items: center; gap: 8px; }
    .sheet-del-btn {
      border: none; background: rgba(168, 87, 87, 0.08); color: #A85757;
      font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    }
    .sheet-del-btn.confirm { background: #A85757; color: #FFFFFF; }
    .card-del-btn {
      border: none; background: transparent; color: #B4B8C4; font-size: 11.5px; font-weight: 600;
      padding: 2px 6px; border-radius: 6px; cursor: pointer;
    }
    .card-del-btn.confirm { color: #A85757; background: rgba(168, 87, 87, 0.08); }
    .inline-link-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 4px 0; border-bottom: 1px solid var(--border-hairline);
    }
    .inline-link-row:last-child { border-bottom: none; }
    .danger-text-btn {
      display: block; margin: 10px auto 0; border: none; background: transparent;
      color: #A85757; font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer;
    }

    /* 技巧抽屉：八层级阶梯卡片 & 4W1H卡片 */
    .ladder-group {
      background: #FFFFFF; border-radius: 14px; padding: 11px 12px; margin-bottom: 8px;
      border: 1px solid var(--border-hairline); border-left: 3px solid var(--ink-accent);
    }
    .ladder-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .ladder-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .ladder-period { font-size: 11px; color: var(--text-secondary); }
    .ladder-item {
      width: 100%; text-align: left; border: none; background: #F7F7F8; border-radius: 10px;
      padding: 8px 10px; margin-top: 5px; cursor: pointer; display: block;
    }
    .ladder-item-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
    .ladder-item-q { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
    .w4-row { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border-hairline); font-size: 12.5px; }
    .w4-row:last-child { border-bottom: none; }
    .w4-key { font-weight: 700; color: var(--text-primary); }
    .w4-desc { color: #525661; line-height: 1.45; }

    /* =========================================================
       月度总表：直接在表格上点选连线 + 静谧莫兰迪色
       ========================================================= */
    .trace-scroll { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .trace-chip {
      border: 1px solid var(--border-hairline); background: #FFFFFF; color: #4A4E59;
      font-size: 12px; font-weight: 600; padding: 6px 12px; min-height: 36px;
      border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .trace-chip.active { background: var(--text-primary); color: #FFFFFF; border-color: var(--text-primary); }
    .trace-chip.add-chip { background: transparent; border-style: dashed; border-color: #CFD3DC; color: var(--text-secondary); }
    .trace-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    .month-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; min-height: 32px;
    }
    .month-toolbar button, .month-text-btn {
      min-height: 34px; padding: 0 6px; border: 0; background: transparent;
      color: var(--ink-accent); font: inherit; font-weight: 600; cursor: pointer;
    }

    .matrix-card {
      background: #FFFFFF; border-radius: 14px; border: 1px solid var(--border-soft);
      overflow: visible; position: relative; margin-bottom: 14px;
    }
    .matrix-head {
      display: grid; grid-template-columns: 32px repeat(4, minmax(0, 1fr));
      background: #F4F5F7; border-bottom: 1px solid var(--border-soft);
      font-size: 11px; font-weight: 600; color: #525661; text-align: center;
      position: sticky; top: 0; z-index: 4; border-radius: 13px 13px 0 0;
    }
    .matrix-head > div { padding: 8px 2px; border-right: 1px solid var(--border-hairline); }
    .matrix-head > div:last-child { border-right: none; }

    .matrix-body { position: relative; }
    .matrix-row { display: grid; grid-template-columns: 32px repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border-hairline); }
    .matrix-row.new-quarter { border-top: 1px solid #D3D6DE; }
    .matrix-row:last-child { border-bottom: none; }
    .matrix-month {
      background: #FAFAFB; border-right: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 600; color: #676C78; padding: 6px 2px;
    }
    .matrix-row:last-child .matrix-month { border-bottom-left-radius: 13px; }
    .matrix-row:last-child .matrix-cell:last-child { border-bottom-right-radius: 13px; }

    .matrix-cell {
      appearance: none; border: 0; border-right: 1px solid var(--border-hairline);
      background: transparent; text-align: left; font-family: inherit;
      padding: 7px 5px; font-size: 11px; line-height: 1.42; color: #2D3038;
      cursor: pointer; min-height: 54px; display: flex; flex-direction: column; gap: 3px;
      align-items: stretch; overflow-wrap: anywhere; position: relative; z-index: 1;
      transition: background 0.15s ease, opacity 0.18s ease, box-shadow 0.15s ease;
    }
    .matrix-cell:last-child { border-right: none; }
    .matrix-cell:active { background: #F4F5F7; }
    .matrix-cell.dimmed { opacity: 0.3; }
    .matrix-cell.highlighted { background: var(--ink-accent-soft); }
    .matrix-cell.pick-origin {
      background: color-mix(in srgb, var(--active-pen, #3B76B8) 14%, transparent);
      box-shadow: inset 0 0 0 1.8px var(--active-pen, #3B76B8);
      z-index: 2;
    }
    .m-bullet { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .m-bullet.key { font-weight: 600; color: var(--text-primary); }

    .color-swatches { display: flex; align-items: center; gap: 12px; padding: 4px 0 6px; }
    .swatch-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.16s var(--spring);
    }
    .swatch-btn.active { transform: scale(1.1); box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #16171A; }

    .month-link-list { display: flex; flex-direction: column; }
    .month-link-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid var(--border-hairline);
    }
    .month-link-info { flex: 1; min-width: 0; }
    .month-link-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); margin-bottom: 3px; }
    .month-link-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .month-link-sub { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .month-link-del {
      border: none; background: #F0F1F4; color: #5A5E68; font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
    }

    /* 表格直接连线时的底部悬浮状态条（支持单手秒切连线主题画笔） */
    .link-banner {
      position: absolute; left: 16px; right: 16px; bottom: calc(88px + var(--safe-bottom));
      background: rgba(22, 23, 26, 0.94); color: #FFFFFF; border-radius: 16px;
      padding: 10px 12px; display: none; flex-direction: column;
      gap: 8px; font-size: 12px; z-index: 25; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
    }
    .link-banner.show { display: flex; }
    .link-banner-pens {
      display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none;
    }
    .link-banner-pens:empty { display: none; }
    .link-banner-pens::-webkit-scrollbar { display: none; }
    .pen-chip {
      border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78); font-size: 11.5px; font-weight: 600;
      padding: 5px 10px; border-radius: 999px; white-space: nowrap; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .pen-chip.active {
      background: #FFFFFF; color: #16171A; border-color: #FFFFFF;
    }
    .link-banner-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .link-banner-cancel {
      border: none; background: rgba(255, 255, 255, 0.18); color: #FFF;
      font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
    }
    .month-link-trace-btn {
      border: 1px solid var(--border-hairline); background: #FFFFFF; color: #4A4E59;
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer; margin-bottom: 4px;
    }

    /* 技巧页 */
    .technique-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .tech-card { background: #FFFFFF; border-radius: var(--radius-card); padding: 15px; box-shadow: var(--shadow-card); border: 1px solid var(--border-hairline); cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
    .tech-card.wide { grid-column: span 2; flex-direction: row; align-items: center; gap: 13px; }
    .tech-name { font-size: 14.5px; font-weight: 700; }
    .tech-brief { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
    .mindset-card { background: #FFFFFF; border-radius: 16px; padding: 14px 15px; box-shadow: var(--shadow-card); border: 1px solid var(--border-hairline); margin-bottom: 10px; }
    .mindset-title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
    .mindset-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.55; }

    /* 底部悬浮双岛导航 */
    .bottom-dock-wrap {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 12px 16px calc(18px + var(--safe-bottom));
      background: linear-gradient(to top, rgba(247, 247, 248, 0.98) 55%, rgba(247, 247, 248, 0));
      display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 20;
    }
    .dock-pill {
      flex: 1; height: 58px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border-radius: var(--radius-pill); box-shadow: var(--shadow-dock);
      border: 1px solid rgba(255, 255, 255, 0.92); padding: 5px;
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; pointer-events: auto;
    }
    .dock-btn { border: none; background: transparent; height: 48px; border-radius: var(--radius-pill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #9397A1; font-size: 10px; font-weight: 600; cursor: pointer; }
    .dock-btn.active { background: var(--bg-pill-active); color: var(--text-primary); }
    .dock-btn svg { width: 18px; height: 18px; }
    .fab-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--text-primary); color: #FFFFFF; box-shadow: var(--shadow-fab); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; pointer-events: auto; }

    /* Bottom Sheet */
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(17, 18, 20, 0.28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.22s ease; z-index: 40; display: flex; align-items: flex-end; }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet-panel { width: 100%; max-height: 90%; background: #F9F9FB; border-radius: 26px 26px 0 0; padding: 10px 18px calc(22px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s var(--spring); overflow-y: auto; box-shadow: 0 -10px 34px rgba(17, 18, 20, 0.14); }
    .sheet-backdrop.open .sheet-panel { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: #D6D8E0; margin: 0 auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-title { font-size: 16.5px; font-weight: 700; color: var(--text-primary); }
    .sheet-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: #EAEBEF; color: #5A5E68; display: flex; align-items: center; justify-content: center; cursor: pointer; }


    .sheet-panel:has(.cloud-login) {
      background: #F9F9FB;
      padding: 10px 18px calc(22px + var(--safe-bottom));
    }
    .cloud-login { padding-top: 2px; }
    .cloud-login-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cloud-login-title { font-size: 16.5px; line-height: 1.3; font-weight: 700; color: var(--text-primary); }
    .cloud-login-title:focus { outline: none; }
    .cloud-login-intro { margin: -4px 0 14px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.5; }
    .cloud-login-dismiss { width: 28px; height: 28px; flex: 0 0 28px; }
    .cloud-login-form { display: grid; gap: 11px; }
    .cloud-login-field { display: grid; gap: 5px; min-width: 0; }
    .cloud-login-field label { font-size: 12px; font-weight: 600; color: #525661; }
    .cloud-login-field .soft-input {
      min-height: 42px; padding: 9px 12px; font-size: 13.5px;
      background: #FFFFFF; border-color: #E2E4EA; border-radius: 12px; caret-color: var(--ink-accent);
    }
    .cloud-login-field .soft-input:focus { border-color: var(--ink-accent); }
    .cloud-login-password { position: relative; }
    .cloud-login-password .soft-input { padding-right: 54px; }
    .cloud-login-reveal {
      position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
      height: 30px; min-width: 44px; border: 0; border-radius: 8px; background: transparent;
      color: var(--ink-accent); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .primary-btn.cloud-login-submit {
      min-height: 44px; margin: 4px 0 0; background: var(--text-primary); border-radius: 13px; font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .cloud-login-submit:disabled { cursor: wait; opacity: .78; }
    .btn-spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.32); border-top-color: #FFFFFF;
      display: inline-block; animation: btnSpin 0.72s linear infinite; flex-shrink: 0;
    }
    @keyframes btnSpin { to { transform: rotate(360deg); } }
    .cloud-login-note { text-align: center; font-size: 11.5px; line-height: 1.45; color: var(--text-secondary); margin-top: 10px; }
    .cloud-login-feedback { font-size: 12px; line-height: 1.45; color: #A85757; }
    .cloud-login-feedback:not(:empty) { margin: 10px 0 0; }

    .cloud-profile-card {
      display: flex; align-items: center; gap: 12px;
      background: #FFFFFF; border: 1px solid var(--border-hairline); border-radius: 16px;
      padding: 13px 14px; margin-bottom: 12px; box-shadow: var(--shadow-card);
    }
    .cloud-avatar {
      width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
      background: var(--ink-accent-soft); color: var(--ink-accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; text-transform: uppercase;
    }
    .cloud-profile-main { flex: 1; min-width: 0; }
    .cloud-account-identity {
      margin: 0; color: var(--text-primary); font-size: 14.5px; font-weight: 700;
      line-height: 1.35; overflow-wrap: anywhere;
    }
    .cloud-account-status {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 3px;
      font-size: 11.5px; color: var(--text-secondary);
    }
    .cloud-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-sage); }
    .cloud-status-dot.warn { background: #E2A445; }
    .cloud-account-notice {
      margin: 0 0 12px; padding: 10px 12px; border-radius: 12px;
      background: #FDF6EA; color: #8A6220; font-size: 12px; line-height: 1.5;
    }
    .cloud-account-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cloud-account-actions button {
      min-height: 42px; padding: 9px 12px; border-radius: 12px;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .cloud-account-actions .cloud-account-change { background: var(--text-primary); border: 1px solid var(--text-primary); color: #FFFFFF; }
    .cloud-account-actions .cloud-account-secondary { background: #FFFFFF; border: 1px solid var(--border-soft); color: #4A4E59; }
    .cloud-account-actions .cloud-account-full { grid-column: span 2; }
    .cloud-account-actions .cloud-account-danger { color: #A85757; border-color: rgba(168, 87, 87, 0.22); background: rgba(168, 87, 87, 0.04); }
    .cloud-account .cloud-login-feedback[data-success="true"] { color: #2E7D60; }
    .cloud-password-panel .cloud-login-intro { margin-bottom: 12px; }
    .cloud-password-panel .cloud-login-form { gap: 10px; }
    @media (prefers-reduced-motion: reduce) {
      .sheet-panel:has(.cloud-login), .sheet-backdrop:has(.cloud-login) { transition: none; }
    }

    .mood-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .mood-item { border: 1.4px solid transparent; background: #FFFFFF; border-radius: 14px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: #4A4E59; cursor: pointer; box-shadow: var(--shadow-card); }
    .mood-item.selected { border-color: var(--text-primary); }

    .field-label { font-size: 12px; font-weight: 600; color: #525661; margin: 9px 0 5px; display: flex; justify-content: space-between; }
    .soft-textarea {
      width: 100%; border: 1px solid #E2E4EA; background: #FFFFFF; border-radius: 12px;
      padding: 9px 11px; font-size: 13.5px; line-height: 1.5; color: var(--text-primary); resize: none; outline: none;
    }
    .soft-input {
      width: 100%; border: 1px solid #E2E4EA; background: #FFFFFF; border-radius: 11px;
      padding: 9px 11px; font-size: 13.5px; color: var(--text-primary); outline: none;
    }
    .soft-textarea:focus, .soft-input:focus { border-color: var(--ink-accent); }
    .primary-btn {
      width: 100%; border: none; background: var(--text-primary); color: #FFFFFF;
      font-size: 15px; font-weight: 600; padding: 13px 16px; border-radius: 14px; cursor: pointer; margin-top: 12px;
    }
    .quiet-note { font-size: 12px; color: var(--text-secondary); margin: 2px 0 8px; line-height: 1.45; }
    .detail-block { background: #FFFFFF; border-radius: 14px; padding: 12px 13px; margin-bottom: 9px; border: 1px solid var(--border-hairline); }
    .detail-q { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
    .detail-a { font-size: 13.5px; line-height: 1.55; color: var(--text-primary); }

    .toast {
      position: absolute; top: 48px; left: 50%; transform: translate(-50%, -16px);
      background: rgba(22, 23, 26, 0.9); color: #FFFFFF; font-size: 12px; font-weight: 500;
      padding: 8px 15px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: all 0.24s var(--spring); z-index: 60; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="viewport-shell">
    <div class="app-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="1" fill="#16171A"/><rect x="4.3" y="4" width="3" height="7" rx="1" fill="#16171A"/><rect x="8.6" y="2" width="3" height="9" rx="1" fill="#16171A"/><rect x="13" y="0" width="3" height="11" rx="1" fill="#16171A"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 8.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z" fill="#16171A"/><path d="M4.2 6.8a4.7 4.7 0 0 1 6.6 0" stroke="#16171A" stroke-width="1.5" stroke-linecap="round"/><path d="M1.6 4.2a8.4 8.4 0 0 1 11.8 0" stroke="#16171A" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.7" y="0.7" width="19.6" height="9.6" rx="2.8" stroke="#16171A" stroke-width="1.2"/><rect x="2.3" y="2.3" width="16.4" height="6.4" rx="1.6" fill="#16171A"/><path d="M22 3.8v3.4" stroke="#16171A" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="toast" id="toast">已保存</div>

      <div class="link-banner" id="linkBanner">
        <div class="link-banner-pens" id="linkBannerPens"></div>
        <div class="link-banner-row">
          <span id="linkBannerText">轻点起点</span>
          <button class="link-banner-cancel" id="linkBannerCancel">完成</button>
        </div>
      </div>

      <div class="cloud-bar"><button type="button" class="pill-action" id="cloudAccountBtn" hidden>连接云端</button></div>
      <main class="app-scroll" id="appScroll">
        <!-- TAB 1: 每日 -->
        <section class="tab-page active" id="page-daily">
          <div class="page-header">
            <h1 class="page-title">复盘自己</h1>
            <button type="button" class="date-picker-btn" id="openCalendarBtn">
              <span id="dailyHeaderMeta"></span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="week-strip-wrap" id="weekStripWrap">
            <button type="button" class="week-edge-btn" id="prevWeekBtn" aria-label="上一周">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="week-strip" id="weekStrip"></div>
            <button type="button" class="week-edge-btn" id="nextWeekBtn" aria-label="下一周">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <div class="section-head">
            <div class="section-title">
              <span id="daySectionTitle">今日触动</span>
              <span class="section-ratio" id="momentCount">0/3</span>
            </div>
            <button class="pill-action" id="quickAddBtn">记一笔 +</button>
          </div>
          <div class="card-stack" id="momentList"></div>
        </section>

        <!-- TAB 2: 周度 -->
        <section class="tab-page" id="page-weekly">
          <div class="page-header">
            <h1 class="page-title">周度总览</h1>
            <div class="week-nav-inline">
              <button type="button" class="week-nav-arrow" id="weeklyPrevBtn" aria-label="上一周">‹</button>
              <button type="button" class="date-picker-btn" id="weeklyCalendarBtn" style="font-size:12.5px;padding:4px 2px;">
                <span id="weeklyRangeLabel">4/20 – 4/26</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button type="button" class="week-nav-arrow" id="weeklyNextBtn" aria-label="下一周">›</button>
            </div>
          </div>
          <div class="mode-bar" id="weekModeBar">
            <button class="mode-btn active" data-wmode="focus">聚焦</button>
            <button class="mode-btn" data-wmode="link">联结</button>
            <button class="mode-btn" data-wmode="summary">总结</button>

    // 真实日历工具（支持任意历史/未来日期与按周切换）
    function todayIso() { return toIso(new Date()); }
    const DOW_META = [
      { dow: 'MON', short: 'M' }, { dow: 'TUES', short: 'T' }, { dow: 'WED', short: 'W' },
      { dow: 'THUR', short: 'T' }, { dow: 'FRI', short: 'F' }, { dow: 'SAT', short: 'S' }, { dow: 'SUN', short: 'S' }
    ];

    function parseIso(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function toIso(dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    function shiftIso(iso, deltaDays) {
      const dt = parseIso(iso);
      dt.setDate(dt.getDate() + deltaDays);
      return toIso(dt);
    }
    function formatShortMd(iso) {
      const dt = parseIso(iso);
      return `${dt.getMonth() + 1}/${dt.getDate()}`;
    }
    function getWeekDaysFor(iso) {
      const dt = parseIso(iso);
      const offsetToMon = (dt.getDay() + 6) % 7; // 周一为一周起点
      const mon = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - offsetToMon);
      return Array.from({ length: 7 }, (_, i) => {
        const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
        const id = toIso(cur);
        return {
          id,
          shortDate: `${cur.getMonth() + 1}/${cur.getDate()}`,
          dow: DOW_META[i].dow,
          short: DOW_META[i].short,
          num: cur.getDate(),
          label: `${cur.getMonth() + 1}月${cur.getDate()}日`,
          isToday: id === todayIso()
        };
      });
    }

    function emptyMonths() {
      return Array.from({ length: 12 }, (_, i) => ({
        m: i + 1, mind: [], action: [], result: [], note: ''
      }));
    }

    const DEFAULT_STATE = {
      selectedDay: todayIso(),
      activeTab: 'daily',

    // Fingerprints of the previous bundled examples, in month and column order.
    const LEGACY_MONTH_EXAMPLES = [[[1585142858], [3493584514], [254184012], 3097758195], [[1629159852], [4073790153, 3123257952], [2898708788, 834492917], 2409493998], [[1266061918], [4252870540], [647897726], 4228040608], [[3518536597], [2876708259], [330912828], 1481959754], [[3491733723], [1864107654, 557988748], [1817244438], 1298817819], [[155810341], [3184387455], [3455828324], 3805179178], [[1077987471], [13934666], [486787229, 3485328834], 4222162910], [[4059931848], [2757072581], [2528092544, 1008065641], 729583450], [[1890978869, 4239517548], [762516469], [2071207333], 4032573354], [[619393260], [2270696504], [1652195085], 2688313907], [[1850084961], [3931092410], [2268850406], 70525892], [[2594270390], [1804659218], [1960797827], 3450675682]];

    function exampleFingerprint(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
      return hash >>> 0;
    }

    function stripLegacyExamples(data) {
      data.moments = (data.moments || []).filter(item => !/^(d[12]|w(?:[1-9]|1[0-3])|p[1-4])$/.test(item.id));
      const keptIds = new Set(data.moments.map(item => item.id));
      data.weekLinks = (data.weekLinks || []).filter(link => keptIds.has(link.from) && keptIds.has(link.to));
      data.weekSummaries = (data.weekSummaries || []).filter(item => !/^s[1-4]$/.test(item.id));
      data.months = emptyMonths().map(blank => {
        const prior = data.months?.find(row => row.m === blank.m);
        if (!prior) return blank;
        const row = { ...blank, ...prior };
        ['mind', 'action', 'result', 'note'].forEach((column, index) => {
          const sample = LEGACY_MONTH_EXAMPLES[row.m - 1][index];
          if (Array.isArray(row[column])) {
            const first = row[column][0];
            row[column] = row[column].filter(value => !sample.includes(exampleFingerprint(value)));
            if (row[column][0] !== first) delete row[`key${column[0].toUpperCase()}${column.slice(1)}`];
          } else if (exampleFingerprint(row[column]) === sample) {
            row[column] = '';
          }
        });
        return row;
      });
      data.monthLinks = (data.monthLinks || []).filter(link => !/^ml(?:[1-9]|10)$/.test(link.id));
      const keptTraces = new Set(data.monthLinks.map(link => link.trace));
      data.monthTraces = (data.monthTraces || []).filter(trace =>
        !['media', 'self', 'workshop'].includes(trace.id) || keptTraces.has(trace.id));
      data.monthTraceFilter = 'all';
      return data;
    }

      if (!ready || !changedSinceSync()) return;
      try {
        localStorage.setItem(cloudDraftKey(), JSON.stringify({ revision: cloudRevision, content: recordContent(state) }));
      } catch {}
      cloudButton.textContent = conflict ? '同步冲突' : '待同步';
      clearTimeout(cloudTimer);
      if (!conflict) cloudTimer = setTimeout(syncCloud, 250);

    async function syncCloud() {
      if (!ready || syncing || conflict || !changedSinceSync()) return;
      syncing = true;
      const content = structuredClone(recordContent(state));
      const nextRevision = cloudRevision + 1;
      cloudButton.textContent = '同步中';
      try {
        const table = cloud.from('reflection_notebooks');
        const result = cloudRevision
          ? await table.update({ content, revision: nextRevision }).eq('owner_id', account.id).eq('revision', cloudRevision).select('revision').maybeSingle()
          : await table.insert({ owner_id: account.id, content, revision: nextRevision }).select('revision').single();
        if (result.error && result.error.code !== '23505') throw result.error;
        if (!result.data) {
          conflict = true;
          cloudButton.textContent = '同步冲突';
          return;
        }
        cloudRevision = nextRevision;
        lastCloudContent = JSON.stringify(content);
        if (changedSinceSync()) queueCloudSave();
        else {
          try { localStorage.removeItem(cloudDraftKey()); } catch {}
          cloudButton.textContent = '已同步';
        }
      } catch {
        cloudButton.textContent = '同步失败';
      } finally {
        syncing = false;
      }
    }

        .select('content, revision').eq('owner_id', account.id).maybeSingle();
      if (error) throw error;
      const content = { ...recordContent(structuredClone(DEFAULT_STATE)), ...data?.content };
      cloudRevision = data?.revision || 0;
      lastCloudContent = JSON.stringify(content);
      let draft;
      try { if (!ignoreDraft) draft = JSON.parse(localStorage.getItem(cloudDraftKey()) || 'null'); } catch {}
      if (draft && JSON.stringify(draft.content) === lastCloudContent) {
        try { localStorage.removeItem(cloudDraftKey()); } catch {}
        draft = null;
      }
      conflict = Boolean(draft && draft.revision !== cloudRevision);
      state = { ...structuredClone(DEFAULT_STATE), ...(draft?.content || content), selectedDay: todayIso() };
      ready = true;
      appContent.inert = false;
      dock.inert = false;
      cloudButton.textContent = conflict ? '同步冲突' : '云端';
      switchTab('daily');
    }

    function openCloudAccount(message = '') {

        localRecords.moments.length || localRecords.weekSummaries.length || localRecords.monthLinks.length ||

      const feedback = document.getElementById('cloudFeedback');
      document.getElementById('closeSheetBtn').onclick = closeSheet;
      document.getElementById('cloudLoginTitle').focus({ preventScroll: true });
      if (typeof message === 'string' && message) feedback.dataset.success = 'true';

    function openCloudPasswordSheet() {
      const currentAccount = account;
      if (!currentAccount?.email) return;
      openSheet(`
        <section class="cloud-login cloud-password-panel" role="dialog" aria-modal="true" aria-labelledby="cloudLoginTitle">
          <div class="cloud-login-head">
            <h2 class="cloud-login-title" id="cloudLoginTitle" tabindex="-1">修改密码</h2>

            <div class="cloud-login-field">
              <label for="cloudCurrentPassword">当前密码</label>
              <input class="soft-input" id="cloudCurrentPassword" name="current-password" type="password" autocomplete="current-password" required>

            </div>
            <div class="cloud-login-field">
              <label for="cloudConfirmPassword">确认新密码</label>
              <input class="soft-input" id="cloudConfirmPassword" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
            </div>
            <button type="submit" class="primary-btn cloud-login-submit">保存新密码</button>
          </form>
          <p class="cloud-login-feedback" id="cloudPasswordFeedback" role="status"></p>
        </section>
      `);
      document.getElementById('cloudLoginTitle').focus({ preventScroll: true });
      document.getElementById('closeSheetBtn').onclick = closeSheet;
      const form = document.getElementById('cloudPasswordForm');
      const feedback = document.getElementById('cloudPasswordFeedback');
      const current = document.getElementById('cloudCurrentPassword');
      const next = document.getElementById('cloudNewPassword');
      const confirmation = document.getElementById('cloudConfirmPassword');
      const submit = form.querySelector('[type="submit"]');
      form.onsubmit = async event => {
        event.preventDefault();
        const currentPassword = current.value;
        const newPassword = next.value;
        if (newPassword !== confirmation.value) {
          feedback.textContent = '两次输入的新密码不一致。';
          confirmation.focus();
          return;
        }
        if (newPassword === currentPassword) {
          feedback.textContent = '请输入与当前密码不同的新密码。';
          next.focus();
          return;
        }
        submit.disabled = true;
        submit.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span><span>正在保存…</span>';
        feedback.textContent = '';
        try {
          const { data, error } = await cloud.auth.signInWithPassword({
            email: currentAccount.email, password: currentPassword
          });
          if (error || data.user?.id !== currentAccount.id) {
            feedback.textContent = error?.code === 'invalid_credentials' ? '当前密码不正确。' : '暂时无法核对账号，请稍后重试。';
            return;
          }
          if (!form.isConnected || !sheetBackdrop.classList.contains('open')) return;
          const result = await cloud.auth.updateUser({ password: newPassword, current_password: currentPassword });
          if (result.error) {
            feedback.textContent = result.error.code === 'weak_password' ? '新密码未达到账号安全要求，请换一个。' : '修改密码失败，请稍后重试。';
            return;
          }
          account = result.data.user;
          form.reset();
          if (form.isConnected && sheetBackdrop.classList.contains('open')) openCloudAccount('密码已修改');
          else showToast('密码已修改');
        } catch {
          feedback.textContent = '暂时无法修改密码，请稍后重试。';
        } finally {
          submit.disabled = false;
          submit.textContent = '保存新密码';
        }
      };
    }

    let pulling = false;
    async function pullLatestCloud() {
      if (!cloud || !account || !ready || syncing || pulling || conflict || changedSinceSync()) return;
      pulling = true;
      try {
        const { data, error } = await cloud.from('reflection_notebooks')
          .select('content, revision').eq('owner_id', account.id).maybeSingle();
        if (error || !data) return;
        const remoteRev = data.revision || 0;
        if (remoteRev <= cloudRevision) return;
        if (changedSinceSync()) return;
        const content = { ...recordContent(structuredClone(DEFAULT_STATE)), ...data.content };
        cloudRevision = remoteRev;
        lastCloudContent = JSON.stringify(content);
        Object.assign(state, content);
        if (Array.isArray(state.moments)) {
          state.moments = state.moments.map(m => ({ ...m, dayId: normalizeDayId(m.dayId) }));
        }
        try { localStorage.removeItem(cloudDraftKey()); } catch {}
        cloudButton.textContent = '已同步';
        if (!sheetBackdrop.classList.contains('open')) {
          if (state.activeTab === 'daily') renderDaily();
          else if (state.activeTab === 'weekly') renderWeekly();
          else if (state.activeTab === 'monthly') renderMonthly();
          showToast('已同步最新记录');
        }
      } catch {
      } finally {
        pulling = false;
      }
    }

    window.addEventListener('online', () => {
      if (!ready) return;
      if (changedSinceSync()) syncCloud();
      else pullLatestCloud();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') pullLatestCloud();
    });
    window.addEventListener('focus', () => { pullLatestCloud(); });
    setInterval(() => {
      if (document.visibilityState === 'visible') pullLatestCloud();
    }, 20000);

    async function initCloud() {
      if (!CLOUD_CONFIG.url || !CLOUD_CONFIG.publishableKey) return;
      cloudButton.hidden = false;
      cloudButton.disabled = true;
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.119.2?bundle');
        cloud = createClient(CLOUD_CONFIG.url, CLOUD_CONFIG.publishableKey, {
          auth: {
            storageKey: 'reflection-notebook-auth-v1',
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        });
        const { data, error } = await cloud.auth.getSession();
        if (error) throw error;
        if (data.session) await openCloudNotebook(data.session);
        else cloudButton.textContent = '登录同步';
        cloudButton.onclick = openCloudAccount;
      } catch {
        cloudButton.textContent = '云端连接失败';
        cloudButton.onclick = cloud ? openCloudAccount : () => location.reload();
      } finally {
        cloudButton.disabled = false;
      }
    }

    function saveState() {
      if (account) {
        queueCloudSave();
        return;
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, monthLinkMode: false })); } catch {}
    }

    let pendingMonthFrom = null;

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function updateLinkBanner(text, onCancel, penHtml = '') {
      const b = document.getElementById('linkBanner');

      if (!text) { b.classList.remove('show'); pensEl.innerHTML = ''; return; }

      b.classList.add('show');

    /* =========================================================
       TAB 1：每日 + 双栏重塑（展示态12.5px + 点击全宽16px编辑）
       ========================================================= */
    function miniRingSvg(count, size = 26) {
      if (count === 0) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 26 26"><circle cx="13" cy="13" r="8.2" fill="#ECEEF2"/></svg>`;
      }
      const closed = count >= 3;
      const ratio = Math.min(1, count / 3);
      const stroke = closed ? '#3EA37E' : '#6B93C4';
      const bg = closed ? '#E9F6F0' : '#EFF4FA';
      const r = 8.2, circ = 2 * Math.PI * r, dash = (circ * ratio).toFixed(1);
      return `<svg width="${size}" height="${size}" viewBox="0 0 26 26"><circle cx="13" cy="13" r="${r}" fill="${bg}"/><circle cx="13" cy="13" r="${r}" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${dash} ${circ.toFixed(1)}" transform="rotate(-90 13 13)"/></svg>`;
    }

    function renderWeekStrip() {
      const wrap = document.getElementById('weekStrip');
      const weekDays = getWeekDaysFor(state.selectedDay);
      wrap.innerHTML = weekDays.map(day => {
        const count = state.moments.filter(m => m.dayId === day.id).length;
        const cls = ['day-cell', day.isToday ? 'is-today' : '', state.selectedDay === day.id ? 'selected' : ''].filter(Boolean).join(' ');
        return `<button class="${cls}" data-day="${day.id}"><span class="day-dow">${day.short}</span><span class="day-ring-wrap">${miniRingSvg(count, 26)}</span><span class="day-num">${day.num}</span></button>`;
      }).join('');
      wrap.querySelectorAll('.day-cell').forEach(b => b.addEventListener('click', () => { state.selectedDay = b.dataset.day; saveState(); renderDaily(); }));
    }

    function openCalendarSheet(targetTab = 'daily') {
      const initDt = parseIso(state.selectedDay);
      let viewY = initDt.getFullYear();
      let viewM = initDt.getMonth();

      function drawCal() {
        const firstDay = new Date(viewY, viewM, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const gridStart = new Date(viewY, viewM, 1 - startOffset);
        const cells = Array.from({ length: 42 }, (_, i) => {
          const cur = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
          const id = toIso(cur);
          const cnt = state.moments.filter(m => m.dayId === id).length;
          return { id, num: cur.getDate(), other: cur.getMonth() !== viewM, today: id === todayIso(), selected: id === state.selectedDay, cnt };
        });

        openSheet(`
          <div class="sheet-head">
            <div class="sheet-title">${targetTab === 'weekly' ? '选择所在周' : '选择日期'}</div>
            <button class="sheet-close" id="closeSheetBtn">✕</button>
          </div>
          <div class="cal-bar">
            <div class="cal-month-nav">
              <button type="button" class="week-nav-arrow" id="calPrevM" aria-label="上个月">‹</button>
              <span>${viewY}年${viewM + 1}月</span>
              <button type="button" class="week-nav-arrow" id="calNextM" aria-label="下个月">›</button>
            </div>
            <button type="button" class="pill-action" id="calGoToday" style="padding:5px 11px;font-size:12px;">${targetTab === 'weekly' ? '本周' : '今天'}</button>
          </div>
          <div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
          <div class="cal-grid">
            ${cells.map(c => `
              <button type="button" class="cal-day ${c.other ? 'other' : ''} ${c.today ? 'today' : ''} ${c.selected ? 'selected' : ''}" data-calday="${c.id}">
                <span class="cal-day-num">${c.num}</span>
                ${miniRingSvg(c.cnt, 16)}
              </button>`).join('')}
          </div>
        `);

        document.getElementById('closeSheetBtn').onclick = closeSheet;
        document.getElementById('calPrevM').onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } drawCal(); };
        document.getElementById('calNextM').onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } drawCal(); };
        const applyDay = (iso) => {
          state.selectedDay = iso;
          saveState(); closeSheet();
          if (targetTab === 'weekly') renderWeekly();
          else renderDaily();
        };
        document.getElementById('calGoToday').onclick = () => applyDay(todayIso());
        document.querySelectorAll('[data-calday]').forEach(btn => {
          btn.onclick = () => applyDay(btn.dataset.calday);
        });
      }
      drawCal();
    }

    function renderDaily() {
      renderWeekStrip();
      const curDt = parseIso(state.selectedDay);
      const isToday = state.selectedDay === todayIso();
      document.getElementById('dailyHeaderMeta').textContent = `${curDt.getFullYear()}年${curDt.getMonth() + 1}月`;
      document.getElementById('daySectionTitle').textContent = isToday ? '今日触动' : `${curDt.getMonth() + 1}月${curDt.getDate()}日`;
      const dayMoments = state.moments.filter(m => m.dayId === state.selectedDay);
      document.getElementById('momentCount').textContent = `${dayMoments.length}/3`;

      const listEl = document.getElementById('momentList');
      if (!dayMoments.length) {
        listEl.innerHTML = `<div class="empty-card"><div class="empty-card-title">这一天暂时留白</div><p class="empty-card-sub">有触动时随手记一句即可</p><button class="pill-action ink" id="emptyAddBtn">记一笔 +</button></div>`;
        document.getElementById('emptyAddBtn').onclick = () => openQuickRecordSheet();
      } else {
        listEl.innerHTML = dayMoments.map(m => {

          const hasReframe = Boolean(m.reframeThought || m.nextAction);
          return `
            <div class="moment-card" data-mid="${m.id}">
              <div class="icon-box" style="background:${mood.bg || '#F4F5F7'};">${mood.icon}</div>
              <div class="card-main">
