                <div class="card-meta">
                  <span>${m.time}</span><span>·</span><span>${mood.label}</span>
                  ${hasReframe ? `<span class="dot-reframed"></span>` : ''}
                </div>
              </div>
              <span class="chevron-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span>
            </div>`;
        }).join('');
        listEl.querySelectorAll('.moment-card').forEach(c => c.onclick = () => openReframeDiagramSheet(c.dataset.mid));
      }
    }

    const REFRAME_FIELDS = {
      event: { title: '事件内容', placeholder: '修改这件让你有触动的事' },
      pastThought: { title: '当时想法', placeholder: '事件发生时你的想法和感受' },
      reframeThought: { title: '重新注意到', placeholder: '回顾左侧内容后，重新注意到了什么' },
      pastAction: { title: '当时行动', placeholder: '当时采取了什么行动' },
      nextAction: { title: '具体行动', placeholder: '从现在开始可以采取什么行动' },
      pastResult: { title: '当时结果', placeholder: '当时行动带来的结果' },
      expectedResult: { title: '预期结果', placeholder: '这些行动可能带来怎样的结果' }
    };

    function openReframeDiagramSheet(mid) {
      const m = state.moments.find(x => x.id === mid);
      if (!m) return;
      const cell = (key, cls) => {
        const val = (m[key] || '').trim();
        return `
          <button type="button" class="flow-cell ${cls}" data-rf="${key}">
            <span class="flow-cell-tag">${REFRAME_FIELDS[key].title}</span>
            <span class="flow-cell-body ${val ? '' : 'placeholder'}">${escapeHtml(val || '点击填写')}</span>
          </button>`;
      };

      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">意义重塑对照</div>
          <div class="sheet-head-actions">
            <button type="button" class="sheet-del-btn" id="deleteMomentBtn">删除</button>
            <button class="sheet-close" id="closeSheetBtn">✕</button>
          </div>
        </div>
        <div class="flow-event-box">
          <div class="flow-event-head">
            <span class="flow-q">事件（点击可改）</span>
            <div class="flow-mood-row" id="reframeMoodRow">
              ${Object.entries(MOODS).map(([k, cfg]) => `
                <button type="button" class="flow-mood-chip ${m.mood === k ? 'active' : ''}" data-rmood="${k}">${cfg.icon}<span>${cfg.label}</span></button>`).join('')}
            </div>
          </div>
          <button type="button" class="flow-event-edit" data-rf="event">
            <div class="flow-val">${escapeHtml(m.event)}</div>
          </button>
        </div>
        <svg class="flow-fork-svg" viewBox="0 0 320 24" preserveAspectRatio="none">
          <path d="M160 0 V10" stroke="#222429" stroke-width="1.6"/>
          <path d="M160 10 H78 V21" fill="none" stroke="#B6BBC6" stroke-width="1.6"/>
          <path d="M74 17 L78 22 L82 17" fill="none" stroke="#B6BBC6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M160 10 H242 V21" fill="none" stroke="#3B76B8" stroke-width="1.6"/>
          <path d="M238 17 L242 22 L246 17" fill="none" stroke="#3B76B8" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="flow-col-heads">
          <div class="left-h">当时的想法和感受</div>
          <div class="right-h">意义重塑的思考</div>
        </div>
        <div class="flow-grid-row">${cell('pastThought', 'past')}${cell('reframeThought', 'reframe')}</div>
        <div class="flow-arrow-row">
          <div class="flow-arrow-cell"><svg width="11" height="13" viewBox="0 0 14 16"><path d="M7 0v13M3.5 9.5 7 13.5 10.5 9.5" fill="none" stroke="#B6BBC6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div class="flow-arrow-cell"><svg width="11" height="13" viewBox="0 0 14 16"><path d="M7 0v13M3.5 9.5 7 13.5 10.5 9.5" fill="none" stroke="#3B76B8" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="flow-grid-row">${cell('pastAction', 'past')}${cell('nextAction', 'reframe')}</div>
        <div class="flow-arrow-row">
          <div class="flow-arrow-cell"><svg width="11" height="13" viewBox="0 0 14 16"><path d="M7 0v13M3.5 9.5 7 13.5 10.5 9.5" fill="none" stroke="#B6BBC6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div class="flow-arrow-cell"><svg width="11" height="13" viewBox="0 0 14 16"><path d="M7 0v13M3.5 9.5 7 13.5 10.5 9.5" fill="none" stroke="#3B76B8" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="flow-grid-row">${cell('pastResult', 'result-past')}${cell('expectedResult', 'result-future')}</div>
      `);

      document.getElementById('closeSheetBtn').onclick = closeSheet;
      document.querySelectorAll('[data-rmood]').forEach(btn => {
        btn.onclick = () => {
          m.mood = btn.dataset.rmood;
          saveState();
          renderDaily();
          document.querySelectorAll('[data-rmood]').forEach(x => x.classList.toggle('active', x === btn));
          showToast(`已切换为「${MOODS[m.mood].label}」`);
        };
      });
      document.querySelectorAll('[data-rf]').forEach(btn => {
        btn.onclick = () => openSingleReframeEditor(m.id, btn.dataset.rf);
      });
      const delBtn = document.getElementById('deleteMomentBtn');
      delBtn.onclick = () => {
        if (delBtn.dataset.confirm !== 'yes') {
          delBtn.dataset.confirm = 'yes';
          delBtn.classList.add('confirm');
          delBtn.textContent = '确认删除';
          return;
        }
        state.moments = state.moments.filter(x => x.id !== m.id);
        state.weekLinks = state.weekLinks.filter(l => l.from !== m.id && l.to !== m.id);
        saveState(); closeSheet(); renderDaily(); showToast('记录已删除');
      };
    }

    // 单格全宽 16px 舒适编辑（杜绝窄框输入与页面放大）
    function openSingleReframeEditor(mid, fieldKey) {
      const m = state.moments.find(x => x.id === mid);
      const meta = REFRAME_FIELDS[fieldKey];
      if (!m || !meta) return;
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${meta.title}</div>
          <button class="sheet-close" id="backReframeBtn" aria-label="返回">✕</button>
        </div>
        <textarea class="soft-textarea" id="singleRfInput" rows="4" placeholder="${meta.placeholder}">${escapeHtml(m[fieldKey] || '')}</textarea>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="pill-action" id="cancelRfEdit" style="flex:1;padding:12px;border-radius:14px;">返回对照</button>
          <button class="primary-btn" id="saveRfEdit" style="flex:1;margin-top:0;">保存</button>
        </div>
      `);
      const ta = document.getElementById('singleRfInput');
      document.getElementById('backReframeBtn').onclick = () => openReframeDiagramSheet(mid);
      document.getElementById('cancelRfEdit').onclick = () => openReframeDiagramSheet(mid);
      document.getElementById('saveRfEdit').onclick = () => {
        const val = ta.value.trim();
        if (fieldKey === 'event' && !val) return showToast('事件内容不能为空');
        m[fieldKey] = val;
        saveState();
        renderDaily();
        openReframeDiagramSheet(mid);
      };
      setTimeout(() => ta.focus(), 60);
    }

    /* =========================================================
       TAB 2：周度总览
       ========================================================= */
    function renderWeekly() {
      document.querySelectorAll('#weekModeBar .mode-btn').forEach(btn => {
        const active = btn.dataset.wmode === state.weekMode;
        btn.classList.toggle('active', active && state.weekMode !== 'link');
        btn.classList.toggle('ink-active', active && state.weekMode === 'link');
      });

      const boardWrap = document.getElementById('weekBoardWrap');
      const sumWrap = document.getElementById('weekSummaryWrap');

      if (state.weekMode === 'link') {
        if (pendingWeekFrom) {
          const fm = state.moments.find(x => x.id === pendingWeekFrom);
          updateLinkBanner(`起点「${(fm?.event || '').slice(0, 10)}…」→ 轻点终点`, () => {
            pendingWeekFrom = null; state.weekMode = 'focus'; renderWeekly();
          });
        } else {
          updateLinkBanner('轻点起点与终点条目完成联结', () => {
            pendingWeekFrom = null; state.weekMode = 'focus'; renderWeekly();
          });
        }
      } else {
        pendingWeekFrom = null;
        updateLinkBanner(null);
      }

      const weekDays = getWeekDaysFor(state.selectedDay);
      const curWeekStart = weekDays[0].id;
      const weekIdSet = new Set(weekDays.map(d => d.id));
      const curSummaries = state.weekSummaries.filter(s => !s.weekStart || s.weekStart === curWeekStart);
      document.getElementById('weeklyRangeLabel').textContent = `${weekDays[0].shortDate} – ${weekDays[6].shortDate}`;

      const renderPlanHtml = (plan) => {
        if (!plan) return '';
        const parts = [
          plan.when && `<span><strong>何时</strong> ${escapeHtml(plan.when)}</span>`,
          plan.where && `<span><strong>何地</strong> ${escapeHtml(plan.where)}</span>`,
          plan.who && `<span><strong>和谁</strong> ${escapeHtml(plan.who)}</span>`,
          plan.what && `<span><strong>做什么</strong> ${escapeHtml(plan.what)}</span>`,
          plan.how && `<span><strong>怎么做</strong> ${escapeHtml(plan.how)}</span>`,
          plan.budget && `<span><strong>预算</strong> ${escapeHtml(plan.budget)}</span>`
        ].filter(Boolean);
        return parts.length ? `<div class="summary-plan">${parts.join('')}</div>` : '';
      };

      const renderSummaryCard = (s, compact = false) => `
        <div class="summary-block" data-sid="${s.id}" ${compact ? 'style="padding:12px 14px;"' : ''}>
          <div class="summary-top-meta">
            <span>${s.level ? escapeHtml(s.level) : ''}</span>
            <button type="button" class="card-del-btn" data-del-sum="${s.id}">删除</button>
          </div>
          <div class="summary-bracket" ${compact ? 'style="font-size:13.5px;"' : ''}>${escapeHtml(s.title)}</div>
          <div class="summary-body" ${compact ? 'style="font-size:12px;"' : ''}>${escapeHtml(s.body)}</div>
          ${compact ? '' : renderPlanHtml(s.plan)}
        </div>`;

      const bindSummaryEvents = () => {
        sumWrap.querySelectorAll('[data-del-sum]').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            if (btn.dataset.confirm !== 'yes') {
              btn.dataset.confirm = 'yes';
              btn.classList.add('confirm');
              btn.textContent = '确认删除';
              return;
            }
            state.weekSummaries = state.weekSummaries.filter(x => x.id !== btn.dataset.delSum);
            saveState(); renderWeekly(); showToast('总结已删除');
          };
        });
        sumWrap.querySelectorAll('[data-sid]').forEach(el => {
          el.onclick = () => openWeekSummarySheet({ weekStart: curWeekStart, summary: state.weekSummaries.find(x => x.id === el.dataset.sid) });
        });
      };

      if (state.weekMode === 'summary') {
        boardWrap.innerHTML = '';
        sumWrap.innerHTML = `
          ${curSummaries.length ? curSummaries.map(s => renderSummaryCard(s, false)).join('') : `<div class="empty-card"><div class="empty-card-title">本周还没有主题总结</div><p class="empty-card-sub">聚焦重点后，按阶段选一个抽象层级提炼，再用 4W1H 细化行动</p></div>`}
          <button class="primary-btn" id="addWeekSumBtn">新增本周主题总结</button>`;
        document.getElementById('addWeekSumBtn').onclick = () => openWeekSummarySheet({ weekStart: curWeekStart });
        bindSummaryEvents();
      } else {
        boardWrap.innerHTML = `
          <div class="week-board-card" id="weekBoardCard">
            <div class="week-table">
              ${weekDays.map(d => {
                const items = state.moments.filter(m => m.dayId === d.id);
                return `
                  <div class="week-row">
                    <div class="week-date-col">${d.shortDate}<span>${d.dow}</span></div>
                    <div class="week-items-col">
                      ${items.length ? items.map(m => `
                        <div class="week-item-row ${m.focused ? 'focused' : ''} ${pendingWeekFrom === m.id ? 'link-origin' : ''}" data-wid="${m.id}">
                          <span class="week-check-mark">✓</span>
                          <span class="week-item-text">${escapeHtml(m.event)}</span>
                        </div>`).join('') : `<div style="font-size:11px;color:#C4C7D0;padding:5px 6px;">—</div>`}
                    </div>
                    <div class="week-rail-col"></div>
                  </div>`;
              }).join('')}
            </div>
            <svg class="svg-overlay" id="weekSvg" aria-hidden="true"></svg>
          </div>`;

        sumWrap.innerHTML = `
          <div class="section-head" style="margin-top:2px;">
            <div class="section-title"><span>本周提炼主题</span><span class="section-ratio">${curSummaries.length}</span></div>
            <button class="pill-action" id="openSumTabBtn">${curSummaries.length ? '全部' : '去写总结'}</button>
          </div>
          ${curSummaries.slice(0, 2).map(s => renderSummaryCard(s, true)).join('')}`;

        document.getElementById('openSumTabBtn').onclick = () => { state.weekMode = 'summary'; renderWeekly(); };
        bindSummaryEvents();
        boardWrap.querySelectorAll('[data-wid]').forEach(row => {
          row.onclick = () => {
            const id = row.dataset.wid;
            if (state.weekMode === 'focus') {
              const m = state.moments.find(x => x.id === id);
              if (!m) return;
              const weekFocusedCount = state.moments.filter(x => weekIdSet.has(x.dayId) && x.focused).length;
              if (!m.focused && weekFocusedCount >= 3) return showToast('每周聚焦 3 件事即可');
              m.focused = !m.focused; saveState(); renderWeekly();
            } else {
              if (!pendingWeekFrom) { pendingWeekFrom = id; renderWeekly(); }
              else if (pendingWeekFrom === id) { pendingWeekFrom = null; renderWeekly(); }
              else {
                const idx = state.weekLinks.findIndex(l => (l.from === pendingWeekFrom && l.to === id) || (l.from === id && l.to === pendingWeekFrom));
                if (idx !== -1) { state.weekLinks.splice(idx, 1); showToast('已取消联结'); }
                else { state.weekLinks.push({ from: pendingWeekFrom, to: id }); showToast('已联结'); }
                pendingWeekFrom = null; saveState(); renderWeekly();
              }
            }
          };
        });
        requestAnimationFrame(drawWeekArrows);
      }
    }

    function drawWeekArrows() {
      const card = document.getElementById('weekBoardCard');
      const svg = document.getElementById('weekSvg');
      if (!card || !svg) return;
      const cRect = card.getBoundingClientRect();
      if (!cRect.width) return;

      let paths = `<defs><marker id="wArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3B76B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
      state.weekLinks.forEach((lk, idx) => {
        const elA = card.querySelector(`[data-wid="${lk.from}"]`);
        const elB = card.querySelector(`[data-wid="${lk.to}"]`);
        if (!elA || !elB) return;
        const rA = elA.getBoundingClientRect(), rB = elB.getBoundingClientRect();
        const x1 = rA.right - cRect.left + 2, y1 = rA.top + rA.height / 2 - cRect.top;
        const x2 = rB.right - cRect.left + 2, y2 = rB.top + rB.height / 2 - cRect.top;
        const bulge = cRect.width - 8 - (idx % 2) * 7;
        paths += `<path d="M ${x1} ${y1} C ${bulge} ${y1}, ${bulge} ${y2}, ${x2} ${y2}" fill="none" stroke="#3B76B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#wArrow)" />`;
      });
      svg.innerHTML = paths;
    }

    function openWeekSummarySheet({ weekStart, summary = null, presetLevel = '', openPlan = false } = {}) {
      let activeStageId = 'leaf';
      let pickedLevel = summary?.level || presetLevel || '① 自己的状态';
      // 根据初始层级定位阶段
      ABSTRACT_STAGES.forEach(st => {
        if (st.items.some(it => `${it.num} ${it.name}` === pickedLevel)) activeStageId = st.id;
      });
      const initPlan = summary?.plan || {};
      let planExpanded = openPlan || Boolean(summary?.plan && Object.values(summary.plan).some(Boolean));

      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${summary ? '编辑主题总结' : '新增主题总结'}</div>
          <div class="sheet-head-actions">
            ${summary ? `<button type="button" class="sheet-del-btn" id="deleteWsBtn">删除</button>` : ''}
            <button class="sheet-close" id="closeSheetBtn">✕</button>
          </div>
        </div>

        <div class="field-label" style="margin-top:0;">抽象化阶段与层级</div>
        <div class="stage-tabs" id="stageTabs">
          ${ABSTRACT_STAGES.map(st => `<button type="button" class="stage-tab ${st.id === activeStageId ? 'active' : ''}" data-st="${st.id}">${st.name} · ${st.period.replace(' 个月', '月').replace('以上', '+')}</button>`).join('')}
        </div>
        <div class="level-chips" id="levelChips"></div>
        <p class="quiet-note" id="levelPrompt"></p>

        <div class="field-label">主题标题</div>
        <input class="soft-input" id="wsTitle" value="${escapeHtml(summary?.title || '')}" placeholder="例如：【工作坊是我的使命】" />
        <div class="field-label">抽象感悟</div>
        <textarea class="soft-textarea" id="wsBody" rows="3" placeholder="围绕所选层级，提炼本周的看见与规律">${escapeHtml(summary?.body || '')}</textarea>

        <button type="button" class="collapse-link" id="toggle4w1h">${planExpanded ? '▾ 收起 4W1H + 预算 行动计划' : '▸ 用 4W1H + 预算 细化具体行动（选填）'}</button>
        <div id="plan4w1hWrap" style="display:${planExpanded ? 'block' : 'none'};">
          <div class="plan-grid">
            <div><span class="plan-field-label">When · 具体日期</span><input class="soft-input" id="pWhen" value="${escapeHtml(initPlan.when || '')}" placeholder="如 4/28 周二" /></div>
            <div><span class="plan-field-label">Where · 地点区域</span><input class="soft-input" id="pWhere" value="${escapeHtml(initPlan.where || '')}" placeholder="如 青山咖啡馆" /></div>
            <div><span class="plan-field-label">Who · 具体对象</span><input class="soft-input" id="pWho" value="${escapeHtml(initPlan.who || '')}" placeholder="如 小幡先生" /></div>
            <div><span class="plan-field-label">How much · 预算</span><input class="soft-input" id="pBudget" value="${escapeHtml(initPlan.budget || '')}" placeholder="如 ¥60 / 30分钟" /></div>
            <div class="full"><span class="plan-field-label">What · 做什么（立刻可开始）</span><input class="soft-input" id="pWhat" value="${escapeHtml(initPlan.what || '')}" placeholder="如 请教下一步角色定位" /></div>
            <div class="full"><span class="plan-field-label">How · 怎么做</span><input class="soft-input" id="pHow" value="${escapeHtml(initPlan.how || '')}" placeholder="如 提前写好3个问题发消息约时间" /></div>
          </div>
        </div>

        <button class="primary-btn" id="saveWsBtn">保存</button>
      `);

      function renderLevelPicker() {
        const st = ABSTRACT_STAGES.find(x => x.id === activeStageId) || ABSTRACT_STAGES[0];
        document.querySelectorAll('#stageTabs .stage-tab').forEach(b => b.classList.toggle('active', b.dataset.st === activeStageId));
        const chipsEl = document.getElementById('levelChips');
        chipsEl.innerHTML = st.items.map(it => {
          const full = `${it.num} ${it.name}`;
          return `<button type="button" class="level-chip ${pickedLevel === full ? 'active' : ''}" data-lv="${full}" data-q="${escapeHtml(it.q)}">${full}</button>`;
        }).join('');
        const activeIt = st.items.find(it => `${it.num} ${it.name}` === pickedLevel) || st.items[0];
        if (!st.items.some(it => `${it.num} ${it.name}` === pickedLevel)) {
          pickedLevel = `${activeIt.num} ${activeIt.name}`;
          chipsEl.querySelector('.level-chip')?.classList.add('active');
        }
        document.getElementById('levelPrompt').textContent = `自问：${activeIt.q}`;
        chipsEl.querySelectorAll('[data-lv]').forEach(b => {
          b.onclick = () => {
            pickedLevel = b.dataset.lv;
            document.getElementById('levelPrompt').textContent = `自问：${b.dataset.q}`;
            chipsEl.querySelectorAll('[data-lv]').forEach(x => x.classList.toggle('active', x === b));
          };
        });
      }
      renderLevelPicker();

      document.querySelectorAll('#stageTabs .stage-tab').forEach(b => {
        b.onclick = () => { activeStageId = b.dataset.st; renderLevelPicker(); };
      });
      document.getElementById('toggle4w1h').onclick = (e) => {
        planExpanded = !planExpanded;
        document.getElementById('plan4w1hWrap').style.display = planExpanded ? 'block' : 'none';
        e.currentTarget.textContent = planExpanded ? '▾ 收起 4W1H + 预算 行动计划' : '▸ 用 4W1H + 预算 细化具体行动（选填）';
      };
      document.getElementById('closeSheetBtn').onclick = closeSheet;

      document.getElementById('saveWsBtn').onclick = () => {
        let title = document.getElementById('wsTitle').value.trim();
        const body = document.getElementById('wsBody').value.trim();
        if (!title || !body) return showToast('请填写标题和内容');
        if (!title.startsWith('【')) title = `【${title}】`;
        const planRaw = {
          when: document.getElementById('pWhen').value.trim(),
          where: document.getElementById('pWhere').value.trim(),
          who: document.getElementById('pWho').value.trim(),
          what: document.getElementById('pWhat').value.trim(),
          how: document.getElementById('pHow').value.trim(),
          budget: document.getElementById('pBudget').value.trim()
        };
        const plan = Object.values(planRaw).some(Boolean) ? planRaw : null;
        if (summary) {
          Object.assign(summary, { level: pickedLevel, title, body, plan });
        } else {
          state.weekSummaries.unshift({ id: 's_' + Date.now(), weekStart, level: pickedLevel, title, body, plan });
        }
        saveState(); closeSheet(); renderWeekly(); showToast('已保存');
      };

      if (summary) {
        const delBtn = document.getElementById('deleteWsBtn');
        delBtn.onclick = () => {
          if (delBtn.dataset.confirm !== 'yes') {
            delBtn.dataset.confirm = 'yes';
            delBtn.classList.add('confirm');
            delBtn.textContent = '确认删除';
            return;
          }
          state.weekSummaries = state.weekSummaries.filter(x => x.id !== summary.id);
          saveState(); closeSheet(); renderWeekly(); showToast('总结已删除');
        };
      }
    }

    /* =========================================================
       TAB 3：月度总表（回归直接在表格上点起点 → 点终点连线）
       ========================================================= */
    const COL_LABELS = { mind: '内心', action: '行动', result: '结果', note: '备注' };
    const UNGROUPED_TRACE = { id: 'ungrouped', name: '默认', color: '#3B76B8' };

    function monthTraces() { return [...state.monthTraces, UNGROUPED_TRACE]; }
    function monthCellLabel(id) { const [m, c] = id.split('-'); return `${m}月 · ${COL_LABELS[c]}`; }
    function monthCellText(id) {
      const [m, c] = id.split('-');
      const v = state.months.find(r => r.m === Number(m))?.[c];
      return (Array.isArray(v) ? v.join('；') : v) || '';
    }
    function visibleMonthLinks() {
      return state.monthLinks.filter(l => state.monthTraceFilter === 'all' || l.trace === state.monthTraceFilter);
    }

    function renderMonthly() {
      const linkBtn = document.getElementById('toggleMonthLinkBtn');
      linkBtn.textContent = state.monthLinkMode ? '完成' : '连线';
      linkBtn.classList.toggle('accent', state.monthLinkMode);

      const filterBar = document.getElementById('traceFilterBar');
      const traces = [{ id: 'all', name: '全部' }, ...monthTraces().filter(t =>
        t.id !== 'ungrouped' || state.monthLinks.some(l => l.trace === t.id))];
      if (!traces.some(t => t.id === state.monthTraceFilter)) state.monthTraceFilter = 'all';

      filterBar.innerHTML = traces.map(t => {
        const active = state.monthTraceFilter === t.id;
        return `<button class="trace-chip ${active ? 'active' : ''}" data-tf="${t.id}">${t.color ? `<span class="trace-dot" style="background:${t.color}"></span>` : ''}${escapeHtml(t.name)}</button>`;
      }).join('') + `<button class="trace-chip add-chip" id="addTraceBtn">+ 主线</button>`;

      filterBar.querySelectorAll('[data-tf]').forEach(btn => {
        btn.onclick = () => {
          state.monthTraceFilter = btn.dataset.tf;
          if (btn.dataset.tf !== 'all') state.activeLinkTrace = btn.dataset.tf;
          saveState(); renderMonthly();
        };
      });
      document.getElementById('addTraceBtn').onclick = openNewTraceSheet;

      // 确保当前画笔主题有效，并同步高亮色变量
      const allPens = monthTraces();
      if (!allPens.some(t => t.id === state.activeLinkTrace)) {
        state.activeLinkTrace = state.monthTraces[0]?.id || 'ungrouped';
      }
      const currentPen = allPens.find(t => t.id === state.activeLinkTrace) || UNGROUPED_TRACE;
      document.documentElement.style.setProperty('--active-pen', currentPen.color);

      if (state.monthLinkMode) {
        const penHtml = state.monthTraces.map(t => `
          <button type="button" class="pen-chip ${state.activeLinkTrace === t.id ? 'active' : ''}" data-pen="${t.id}">
            <span class="trace-dot" style="background:${t.color};"></span>${escapeHtml(t.name)}
          </button>`).join('') +
          `<button type="button" class="pen-chip ${state.activeLinkTrace === 'ungrouped' ? 'active' : ''}" data-pen="ungrouped"><span class="trace-dot" style="background:#3B76B8;"></span>不分组</button>` +
          `<button type="button" class="pen-chip" id="penNewBtn">+ 新主线</button>`;

        const msg = pendingMonthFrom
          ? `${monthCellLabel(pendingMonthFrom)} → 轻点目标格`
          : `正在用「${currentPen.name}」连线 · 轻点起点格`;
        updateLinkBanner(msg, () => {
          pendingMonthFrom = null; state.monthLinkMode = false; renderMonthly();
        }, penHtml);

        document.querySelectorAll('#linkBannerPens [data-pen]').forEach(btn => {
          btn.onclick = () => {
            state.activeLinkTrace = btn.dataset.pen;
            if (state.monthTraceFilter !== 'all') state.monthTraceFilter = btn.dataset.pen;
            saveState(); renderMonthly();
          };
        });
        const penNew = document.getElementById('penNewBtn');
        if (penNew) penNew.onclick = openNewTraceSheet;
      } else {
        pendingMonthFrom = null;
        updateLinkBanner(null);
      }

      const links = visibleMonthLinks();
      document.getElementById('monthHint').textContent = `${state.months.length} 个月 · ${links.length} 条联结`;
      const linkedCells = new Set(links.flatMap(l => [l.from, l.to]));
      const body = document.getElementById('matrixBody');

      body.innerHTML = state.months.map(row => `
        <div class="matrix-row ${[4, 7, 10].includes(row.m) ? 'new-quarter' : ''}">
          <div class="matrix-month">${row.m}月</div>
          ${Object.keys(COL_LABELS).map(col => {
            const id = `${row.m}-${col}`;
            const lines = Array.isArray(row[col]) ? row[col] : [row[col]];
            const key = row[`key${col[0].toUpperCase()}${col.slice(1)}`];
            const inTrace = linkedCells.has(id);
            const highlight = state.monthTraceFilter !== 'all' && inTrace;
            const dimmed = state.monthTraceFilter !== 'all' && !inTrace && !state.monthLinkMode;
            const isOrigin = pendingMonthFrom === id;
            return `<button type="button" class="matrix-cell ${highlight ? 'highlighted' : ''} ${dimmed ? 'dimmed' : ''} ${isOrigin ? 'pick-origin' : ''}" data-cell="${id}"
              aria-label="${monthCellLabel(id)}">${lines.map((line, i) =>
                `<span class="m-bullet ${key && i === 0 ? 'key' : ''}">${escapeHtml(line)}</span>`).join('')}</button>`;
          }).join('')}
        </div>`).join('');

      body.querySelectorAll('[data-cell]').forEach(cell => {
        cell.onclick = () => {
          const cid = cell.dataset.cell;
          if (!state.monthLinkMode) return openMonthCellSheet(cid);
          if (!pendingMonthFrom) {
            pendingMonthFrom = cid;
            renderMonthly();
          } else if (pendingMonthFrom === cid) {
            pendingMonthFrom = null;
            renderMonthly();
          } else {
            const existsIdx = state.monthLinks.findIndex(l =>
              (l.from === pendingMonthFrom && l.to === cid) || (l.from === cid && l.to === pendingMonthFrom));
            if (existsIdx !== -1) {
              state.monthLinks.splice(existsIdx, 1);
              showToast('已取消该联结');
            } else {
              const targetTrace = state.activeLinkTrace || 'ungrouped';
              state.monthLinks.push({ id: `ml_${Date.now()}`, trace: targetTrace, from: pendingMonthFrom, to: cid });
              showToast(`已连线（${currentPen.name}）`);
            }
            pendingMonthFrom = null;
            saveState();
            renderMonthly();
          }
        };
      });

      requestAnimationFrame(drawMonthArrows);
    }

              <div class="month-link-row" style="padding:9px 0;">

      document.getElementById('closeSheetBtn').onclick = closeSheet;
      document.querySelectorAll('[data-cycle-link]').forEach(btn => {

          const pool = monthTraces();

          const nextTrace = pool[(curIdx + 1) % pool.length];
          item.trace = nextTrace.id;
          saveState(); renderMonthly(); openMonthLinkList();
          showToast(`已切换为「${nextTrace.name}」`);
        };

      document.querySelectorAll('[data-del-link]').forEach(btn => {
        btn.onclick = () => {
          state.monthLinks = state.monthLinks.filter(x => x.id !== btn.dataset.delLink);
          saveState(); renderMonthly(); openMonthLinkList();
        };
      });
      document.querySelectorAll('[data-del-trace]').forEach(btn => {
        btn.onclick = () => {
          const tid = btn.dataset.delTrace;
          state.monthTraces = state.monthTraces.filter(t => t.id !== tid);
          state.monthLinks.forEach(l => { if (l.trace === tid) l.trace = 'ungrouped'; });
          if (state.monthTraceFilter === tid) state.monthTraceFilter = 'all';
          if (state.activeLinkTrace === tid) state.activeLinkTrace = state.monthTraces[0]?.id || 'ungrouped';
          saveState(); renderMonthly(); openMonthLinkList();
          showToast('主线已删除，原连线已归入默认');
        };
      });
    }

    function drawMonthArrows() {
      const card = document.getElementById('matrixCard');
      const svg = document.getElementById('monthSvg');
      if (!card || !svg) return;
      const cRect = card.getBoundingClientRect();
      if (!cRect.width) return;

      const traceColorMap = {};
      monthTraces().forEach(t => traceColorMap[t.id] = t.color);

      let defs = `<defs>`;
      monthTraces().forEach(t => {
        defs += `<marker id="mArr_${t.id}" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="${t.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>`;
      });
      defs += `</defs>`;

      let paths = defs;
      visibleMonthLinks().forEach(lk => {
        const elA = card.querySelector(`[data-cell="${lk.from}"]`);
        const elB = card.querySelector(`[data-cell="${lk.to}"]`);
        if (!elA || !elB) return;

        const opacity = state.monthTraceFilter === 'all' ? 0.62 : 0.92;
        const width = state.monthTraceFilter === 'all' ? 1.5 : 1.9;
        const color = traceColorMap[lk.trace] || '#3B76B8';

        const rA = elA.getBoundingClientRect(), rB = elB.getBoundingClientRect();
        const [mA, colA] = lk.from.split('-'), [mB, colB] = lk.to.split('-');
        const down = rB.top > rA.top;

        let x1, y1, x2, y2, dStr;
        if (mA === mB) {
          const right = rB.left > rA.left;
          x1 = (right ? rA.right - 6 : rA.left + 6) - cRect.left;
          y1 = rA.top + 5 - cRect.top;
          x2 = (right ? rB.left + 6 : rB.right - 6) - cRect.left;
          y2 = rB.top + 5 - cRect.top;
          dStr = `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${y1 - 13}, ${x2} ${y2}`;
        } else if (colA === colB) {
          x1 = rA.left - cRect.left + 5;
          y1 = (down ? rA.bottom - 5 : rA.top + 5) - cRect.top;
          x2 = rB.left - cRect.left + 5;
          y2 = (down ? rB.top + 7 : rB.bottom - 7) - cRect.top;
          dStr = `M ${x1} ${y1} C ${x1 - 9} ${(y1 + y2) / 2}, ${x2 - 9} ${(y1 + y2) / 2}, ${x2} ${y2}`;
        } else {
          const goRight = rB.left > rA.left;
          x1 = (goRight ? rA.right - 6 : rA.left + 6) - cRect.left;
          y1 = (down ? rA.bottom - 6 : rA.top + 6) - cRect.top;
          x2 = (goRight ? rB.left + 6 : rB.right - 6) - cRect.left;
          y2 = (down ? rB.top + 8 : rB.bottom - 8) - cRect.top;
          const midY = (y1 + y2) / 2;
          dStr = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
        }
        paths += `<path d="${dStr}" fill="none" stroke="${color}" stroke-opacity="${opacity}" stroke-width="${width}" stroke-linecap="round" marker-end="url(#mArr_${lk.trace})" />`;
      });
      svg.innerHTML = paths;
    }

    // 按月聚合各周内容（供月度填写时快捷回看与引用）
    function getWeeksContentForMonth(mNum) {
      const weekMap = new Map();
      const ensureWeek = (iso) => {
        const wd = getWeekDaysFor(iso);
        const key = wd[0].id;
        if (!weekMap.has(key)) {
          weekMap.set(key, { key, label: `${wd[0].shortDate}–${wd[6].shortDate}`, summaries: [], moments: [] });
        }
        return weekMap.get(key);
      };
      state.moments.forEach(m => {
        const dt = parseIso(m.dayId);
        if (dt.getMonth() + 1 === mNum) ensureWeek(m.dayId).moments.push(m);
      });
      state.weekSummaries.forEach(s => {
        const refIso = s.weekStart || todayIso();
        const dt = parseIso(refIso);
        if (dt.getMonth() + 1 === mNum) ensureWeek(refIso).summaries.push(s);
      });
      return Array.from(weekMap.values()).sort((a, b) => b.key.localeCompare(a.key));
    }

    function openMonthSourcesSheet() {
      const selectedMonth = parseIso(state.selectedDay || todayIso()).getMonth() + 1;
      openSheet(`
        <div class="sheet-title">${selectedMonth}月日记和周记</div>
        <label>选择月份 <select id="sourceMonth">${Array.from({length: 12}, (_, i) =>
          `<option value="${i + 1}" ${i + 1 === selectedMonth ? 'selected' : ''}>${i + 1}月</option>`).join('')}</select></label>

          <summary class="ref-item-tag" style="cursor:pointer;min-height:44px;align-content:center;">${escapeHtml(week.label)} · ${week.summaries.length} 条周总结 · ${week.moments.length} 条日记</summary>
          ${week.summaries.map(item => `<p style="white-space:pre-wrap;"><strong>周总结 · ${escapeHtml(item.title)}</strong><br>${escapeHtml(item.body)}</p>`).join('')}
          ${week.moments.map(item => `<p style="white-space:pre-wrap;"><strong>${escapeHtml(formatShortMd(item.dayId))} · 日记</strong><br>${escapeHtml(item.event)}</p>`).join('')}

      };
      monthPicker.onchange = () => {

        renderSources();

      };
      renderSources();

    function openMonthCellSheet(cid) {
      const [mStr, col] = cid.split('-'), mNum = Number(mStr);
      const row = state.months.find(r => r.m === mNum);
      if (!row) return;
      const isArr = Array.isArray(row[col]);
      const valText = isArr ? row[col].join('\n') : row[col];
      const relLinks = state.monthLinks.filter(l => l.from === cid || l.to === cid);
      const monthWeeks = getWeeksContentForMonth(mNum);
      let activeRefWeek = monthWeeks[0]?.key || '';

      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${mNum}月 · ${COL_LABELS[col]}</div>
          <div class="sheet-head-actions">
            ${valText.trim() ? `<button type="button" class="sheet-del-btn" id="clearMcBtn">清空</button>` : ''}
            <button class="sheet-close" id="closeSheetBtn">✕</button>
          </div>
        </div>
        <div class="field-label">${isArr ? '记录（每行一条）' : '备注'}</div>
        <textarea class="soft-textarea" id="mcEditArea" rows="3">${escapeHtml(valText)}</textarea>

        <div class="ref-panel" id="monthRefPanel">
          <div class="ref-head">
            <span>参考 ${mNum} 月各周内容</span>
            <span>${monthWeeks.length ? '轻点可引用' : ''}</span>
          </div>
          ${monthWeeks.length ? `<div class="ref-week-tabs" id="refWeekTabs"></div><div class="ref-list" id="refItemList"></div>` : `<p class="quiet-note" style="margin:0;">${mNum}月暂无周度记录</p>`}
        </div>

        ${relLinks.length ? `
          <div class="detail-block" style="margin-top:10px;">
            <div class="detail-q">相关联结</div>
            <div class="detail-a" style="font-size:12.5px;color:#4A4E59;">
              ${relLinks.map(l => `
                <div class="inline-link-row">
                  <span>${monthCellLabel(l.from)} → ${monthCellLabel(l.to)}</span>
                  <button type="button" class="month-link-del" data-del-rel="${l.id}">删除</button>
                </div>`).join('')}
            </div>
          </div>` : ''}
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="pill-action" id="startLinkFromCell" style="flex:1;padding:12px;border-radius:14px;">从此格连线</button>
          <button class="primary-btn" id="saveMcBtn" style="flex:1;margin-top:0;">保存</button>
        </div>
      `);

      function renderRefWeek() {
        if (!monthWeeks.length) return;
        const tabsEl = document.getElementById('refWeekTabs');
        const listEl = document.getElementById('refItemList');
        tabsEl.innerHTML = monthWeeks.map(w =>
          `<button type="button" class="ref-wtab ${w.key === activeRefWeek ? 'active' : ''}" data-rw="${w.key}">${w.label}</button>`
        ).join('');
        tabsEl.querySelectorAll('[data-rw]').forEach(b => {
          b.onclick = () => { activeRefWeek = b.dataset.rw; renderRefWeek(); };
        });

        const wk = monthWeeks.find(w => w.key === activeRefWeek) || monthWeeks[0];
        const refEntries = [
          ...wk.summaries.map(s => ({ tag: `周总结 ${s.title}`, text: s.body, quote: `${s.title.replace(/[【】]/g, '')}：${s.body.slice(0, 26)}` })),
          ...wk.moments.sort((a, b) => Number(b.focused) - Number(a.focused)).map(m => ({
            tag: `${formatShortMd(m.dayId)}${m.focused ? ' · 聚焦重点' : ''}`,
            text: m.event,
            quote: m.event
          }))
        ];
        listEl.innerHTML = refEntries.map((item, idx) => `
          <div class="ref-item">
            <div class="ref-item-text">
              <span class="ref-item-tag">${escapeHtml(item.tag)}</span>
              ${escapeHtml(item.text)}
            </div>
            <button type="button" class="ref-quote-btn" data-qidx="${idx}">+ 引用</button>
          </div>`).join('');
        listEl.querySelectorAll('[data-qidx]').forEach(btn => {
          btn.onclick = () => {
            const ta = document.getElementById('mcEditArea');
            const q = refEntries[Number(btn.dataset.qidx)].quote;
            ta.value = ta.value.trim() ? `${ta.value.trim()}\n${q}` : q;
            showToast('已引用到输入框');
          };
        });
      }
      renderRefWeek();

      document.getElementById('closeSheetBtn').onclick = closeSheet;
      const clearBtn = document.getElementById('clearMcBtn');
      if (clearBtn) {
        clearBtn.onclick = () => {
          if (clearBtn.dataset.confirm !== 'yes') {
            clearBtn.dataset.confirm = 'yes';
            clearBtn.classList.add('confirm');
            clearBtn.textContent = '确认清空';
            return;
          }
          row[col] = isArr ? [] : '';
          saveState(); closeSheet(); renderMonthly(); showToast('已清空该格内容');
        };
      }
      document.querySelectorAll('[data-del-rel]').forEach(btn => {
        btn.onclick = () => {
          state.monthLinks = state.monthLinks.filter(l => l.id !== btn.dataset.delRel);
          saveState(); renderMonthly(); openMonthCellSheet(cid); showToast('联结已删除');
        };
      });
      document.getElementById('startLinkFromCell').onclick = () => {
        closeSheet();
        state.monthLinkMode = true;
        pendingMonthFrom = cid;
        renderMonthly();
      };
      document.getElementById('saveMcBtn').onclick = () => {
        const raw = document.getElementById('mcEditArea').value.trim();
        if (isArr) row[col] = raw ? raw.split('\n').map(s => s.trim()).filter(Boolean) : [];
        else row[col] = raw;
        saveState(); closeSheet(); renderMonthly(); showToast(raw ? '已保存' : '已清空该格');
      };
    }

    /* =========================================================

        if (t.id === 'abstract') {

          `);
          document.getElementById('closeSheetBtn').onclick = closeSheet;
          document.querySelectorAll('[data-use-lv]').forEach(btn => {
            btn.onclick = () => {
              state.weekMode = 'summary';
              switchTab('weekly');
              openWeekSummarySheet({ weekStart: curWeekStart, presetLevel: btn.dataset.useLv });
            };
          });
          return;
        }

        if (t.id === 'concrete') {
          openSheet(`
            <div class="sheet-head"><div class="sheet-title">具体化 · 4W1H + 预算</div><button class="sheet-close" id="closeSheetBtn">✕</button></div>
            <p class="quiet-note" style="margin-bottom:10px;">把想法落成能立刻付诸行动的计划，细化到日期、地点、人名与投入。</p>
            <div class="detail-block" style="padding:6px 13px;">
              ${CONCRETE_4W1H.map(item => `
                <div class="w4-row">
                  <div class="w4-key">${item.label}</div>
                  <div class="w4-desc">${item.tip}</div>
                </div>`).join('')}
            </div>
            <button class="primary-btn" id="go4w1hBtn">去周复盘用 4W1H 细化行动</button>
          `);
          document.getElementById('closeSheetBtn').onclick = closeSheet;
          document.getElementById('go4w1hBtn').onclick = () => {
            state.weekMode = 'summary';
            switchTab('weekly');
            openWeekSummarySheet({ weekStart: curWeekStart, openPlan: true });
          };
          return;
        }

        openSheet(`
          <div class="sheet-head"><div class="sheet-title">${t.name}</div><button class="sheet-close" id="closeSheetBtn">✕</button></div>
          <div class="detail-block"><div class="detail-q">核心自问</div><div class="detail-a" style="font-weight:600;">“${escapeHtml(t.prompt)}”</div></div>
          <div class="detail-block"><div class="detail-q">示例</div><div class="detail-a" style="color:#4D515B;">${escapeHtml(t.example)}</div></div>
          <button class="primary-btn" id="applyT">用「${t.name}」记一笔</button>`);
        document.getElementById('closeSheetBtn').onclick = closeSheet;
        document.getElementById('applyT').onclick = () => openQuickRecordSheet(t);
      });
    }

    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetBody = document.getElementById('sheetBody');
    function openSheet(html) {
      sheetBody.innerHTML = html;
      sheetBackdrop.inert = false;
      sheetBackdrop.classList.add('open');
    }
    function closeSheet() {
      sheetBackdrop.classList.remove('open');
      sheetBackdrop.inert = true;
      if (sheetBody.querySelector('.cloud-login')) cloudButton.focus({ preventScroll: true });
    }
    sheetBackdrop.addEventListener('keydown', event => {
      const login = sheetBody.querySelector('.cloud-login');
      if (!login || !sheetBackdrop.classList.contains('open')) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        closeSheet();
      }
      if (event.key !== 'Tab') return;
      const controls = [...login.querySelectorAll('input:not([hidden]), button:not(:disabled)')];
      const first = controls[0];
      const last = controls.at(-1);
      if (event.shiftKey && (document.activeElement === first || document.activeElement.id === 'cloudLoginTitle')) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) closeSheet(); });

    function openQuickRecordSheet(presetTech = null) {
      const recordDay = state.selectedDay;
      const day = parseIso(recordDay);
      const dateLabel = `${day.getFullYear()}年${day.getMonth() + 1}月${day.getDate()}日`;
      let picked = 'flow';
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${presetTech ? presetTech.name : '记一笔'}</div>
          <button class="sheet-close" id="closeSheetBtn">✕</button>
        </div>
        <p class="quiet-note">记录日期 <time datetime="${recordDay}">${dateLabel}</time></p>
        ${presetTech ? `<p class="quiet-note">${escapeHtml(presetTech.prompt)}</p>` : ''}
        <div class="mood-grid" id="mp">${Object.entries(MOODS).map(([k, v]) => `<button class="mood-item ${k === picked ? 'selected' : ''}" data-mood="${k}"><span>${v.icon}</span><span>${v.label}</span></button>`).join('')}</div>
        <p id="phNote" class="quiet-note" style="display:none;">哲学模式：只客观记下“这件事发生了”，不必苛责自己。</p>
        <div class="field-label">事件</div>
        <textarea class="soft-textarea" id="rEv" rows="2" placeholder="写下让你有触动的事"></textarea>
        <div class="field-label">当时感受</div>
        <input class="soft-input" id="rFl" placeholder="选填" />
        <button class="primary-btn" id="sBtn">保存</button>
      `);
      document.getElementById('closeSheetBtn').onclick = closeSheet;
      document.querySelectorAll('#mp .mood-item').forEach(b => b.onclick = () => {
        picked = b.dataset.mood;
        document.querySelectorAll('#mp .mood-item').forEach(x => x.classList.toggle('selected', x.dataset.mood === picked));
        document.getElementById('phNote').style.display = MOODS[picked].negative ? 'block' : 'none';
      });
      document.getElementById('sBtn').onclick = () => {
        const ev = document.getElementById('rEv').value.trim();
        if (!ev) return showToast('请先写下事件');
        state.moments.unshift({
          id: 'm_' + Date.now(), dayId: recordDay, time: '刚刚', mood: picked,
          event: ev, pastThought: document.getElementById('rFl').value.trim(),
          pastAction: '', pastResult: '', reframeThought: '', nextAction: '', expectedResult: '', focused: false
        });
        state.selectedDay = recordDay;
        saveState(); closeSheet();
        const cnt = state.moments.filter(m => m.dayId === recordDay).length;
        switchTab('daily');
        showToast(cnt === 3 && recordDay === todayIso() ? '今日已满 3 件' : '已保存');
      };
    }

    function switchTab(tab) {
      state.activeTab = tab;
      pendingWeekFrom = null;
      pendingMonthFrom = null;
      if (tab !== 'monthly') state.monthLinkMode = false;
      updateLinkBanner(null);
      saveState();

      document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === `page-${tab}`));
      document.querySelectorAll('#bottomDock .dock-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('appScroll').scrollTop = 0;

      if (tab === 'daily') renderDaily();
      if (tab === 'weekly') renderWeekly();
      if (tab === 'monthly') renderMonthly();
      if (tab === 'methods') renderMethods();
    }

    document.querySelectorAll('#bottomDock .dock-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
    document.querySelectorAll('#weekModeBar .mode-btn').forEach(b => b.onclick = () => { state.weekMode = b.dataset.wmode; renderWeekly(); });
    document.getElementById('toggleMonthLinkBtn').onclick = () => {
      state.monthLinkMode = !state.monthLinkMode;
      pendingMonthFrom = null;
      renderMonthly();
    };
    document.getElementById('monthLinkListBtn').onclick = openMonthLinkList;
    document.getElementById('monthSourcesBtn').onclick = openMonthSourcesSheet;
    document.getElementById('fabBtn').onclick = () => openQuickRecordSheet();
    document.getElementById('quickAddBtn').onclick = () => openQuickRecordSheet();
    document.getElementById('openCalendarBtn').onclick = () => openCalendarSheet('daily');
    document.getElementById('weeklyCalendarBtn').onclick = () => openCalendarSheet('weekly');
    document.getElementById('prevWeekBtn').onclick = () => { state.selectedDay = shiftIso(state.selectedDay, -7); saveState(); renderDaily(); };
    document.getElementById('nextWeekBtn').onclick = () => { state.selectedDay = shiftIso(state.selectedDay, 7); saveState(); renderDaily(); };
    document.getElementById('weeklyPrevBtn').onclick = () => { state.selectedDay = shiftIso(state.selectedDay, -7); saveState(); renderWeekly(); };
    document.getElementById('weeklyNextBtn').onclick = () => { state.selectedDay = shiftIso(state.selectedDay, 7); saveState(); renderWeekly(); };

    // 支持 7 天圆环条左右轻滑切周
    (() => {
      let touchStartX = null;
      const strip = document.getElementById('weekStripWrap');
      strip.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      strip.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(dx) > 42) {
          state.selectedDay = shiftIso(state.selectedDay, dx > 0 ? -7 : 7);
          saveState(); renderDaily();
        }
      }, { passive: true });
    })();
    window.addEventListener('resize', () => {
      if (state.activeTab === 'weekly') drawWeekArrows();
      if (state.activeTab === 'monthly') drawMonthArrows();
    });

    switchTab(state.activeTab || 'daily');
    initCloud();
  </script>
</body>
</html>
