<script>
'use strict';
const icons={
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5zm0 12A2.5 2.5 0 0 1 6.5 15H20M9 7h6m-6 4h4"/>',
 day:'<path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
 week:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18m-13 5h1m3 0h1m3 0h1"/>',
 month:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 4v16M4 12h16"/>',
 back:'<path d="m15 6-6 6 6 6"/>',next:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',

const $=id=>document.getElementById(id);

const short=(s,n=52)=>{const t=String(s??'').trim().replace(/\s+/g,' ');return t.length>n?t.slice(0,n)+'…':t;};
const meta={
 day:{label:'日复盘',title:'每日复盘',prompt:'随手记下三件有感触的小事。',guides:['日常简记是周复盘的素材。写一件让你有感触的事，再添一句感受、发现或学到的东西。','想详细回看一件事，可打开该条记录并选择「深入复盘」。先如实记录，再回看它对自己的意义。','「日复盘总览」可以一起读完当天的记录。']},
 week:{label:'周复盘',title:'每周复盘',prompt:'从一周的记录里找线索，想清楚下一步。',guides:['平时可以在日复盘里简记每天 3 件有感触的事，各加一句感受或发现。','周末从本周日记挑出最重要的 3 条，用箭头标出看见的联结。','用一句话归纳它们让你看见了什么，比如自己的状态、在意的事或长处。','把自己想试的事写具体，包括何时、何地、和谁、做什么，必要时记下预算。']},
 month:{label:'月复盘',title:'每月复盘',prompt:'这个月，我有了哪些发现、尝试和收获？',guides:['回看本月的记录，从内心、行动、结果各自挑出 1–3 条重要内容。','内心写感受或新认识。行动写实际做过的事。结果写已经发生的变化。','三项可以来自不同的事，每条单独换行。']}

const dayCaptureFields=[
 ['event','发生了什么？','写当时能看见或听见的事实。','比如：晚饭后，我拿了两张早餐照片，孩子说想出题考我。'],
 ['feeling','当时想了什么、感受到什么？','写下那一刻的真实反应。','比如：原本有点累，听到他主动出题，我一下子来了兴趣。'],
 ['pastAction','当时做了什么？（可选）','','比如：我把手机递给他，让他挑要考我的照片。'],
 ['pastResult','当时有什么结果？（可选）','','比如：我们轮流出了四题。']
];
const dayReviewFields=[
 ['insight','回看后有什么新发现？','可以换个视角，看看这件事还有什么意义。','比如：他有机会出题时，我也更享受这个过程。'],
 ['nextAction','现在我可以做什么？（可选）','把已发生的事和你现在能改变的事分开。','比如：下次晚饭后留 5 分钟，请他来选照片。'],
 ['nextResult','尝试后有什么结果？（可选）','行动后再补记，包括没有变化的情况。','比如：第二天他选好照片后，主动给我出了一题。']
];
const dayFields=[...dayCaptureFields,...dayReviewFields];
const weekFields=[
 ['connection','联结 · 这些片段有什么关系？','写反复出现的线索，或哪件事带动了另一件。','比如：猜照片和散步聊英语时，单词都跟眼前的东西有关。'],
 ['insight','抽象化 · 我看见了什么？','归纳自己的状态、在意的事、长处或行为习惯。','比如：让孩子也能出题时，我更愿意一起玩。'],
 ['action','具体化 · 我想试什么？','写何时、何地、和谁、做什么、怎么做。必要时记下预算。','比如：下周三晚饭后，在家和孩子拿两张照片轮流出题 5 分钟。']
];
const monthFields=[
 ['inner','内心','挑出 1–3 条对自己的新认识、感受或在意的事。','比如：我发现独处一会儿，比多安排一项活动更能让我放松。'],
 ['action','行动','挑出 1–3 条这个月实际做过的尝试或改变。','比如：有三个晚上，我用生活照片和孩子轮流出英语题。'],
 ['result','结果','挑出 1–3 条已经发生的收获或变化。','比如：我把搁置了两个月的普拉提课程笔记整理完了。'],
 ['insight','月度随记（可选）','还想保留什么？','写下一句感想，或记住这个月的一个细节。']
];
const perspectives=[
 ['other','当事人','如果从对方的角度看，TA 当时可能看到了什么、在意什么？'],
 ['friend','旁观朋友','如果这是朋友讲给我的事，我会注意到什么？'],
 ['future','未来的我','一个月后回来看，我可能记得哪个细节？'],
 ['strength','已有长处','这件事里，我已经动用了哪些能力、经验或支持？'],
 ['assumption','换一个解释','我当时默认了什么？如果换一种解释，这件事还可能意味着什么？']
];
const KEY='reflection-notebook-v1';
function iso(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function parseDate(value){const [y,m,d]=value.split('-').map(Number);const date=new Date(2000,0,1,12);date.setFullYear(y,m-1,d);return date;}
function validDate(value){return /^\d{4}-\d{2}-\d{2}$/.test(value)&&iso(parseDate(value))===value;}
function moveDay(value,offset){const date=parseDate(value);date.setDate(date.getDate()+offset);return iso(date);}
function weekStart(value){return moveDay(value,-((parseDate(value).getDay()+6)%7));}
function periodKey(type,value){return type==='day'?value:type==='week'?weekStart(value):value.slice(0,7);}
function currentDate(){return iso(new Date());}

 const fmt=value=>`${Number(value.slice(5,7))}月${Number(value.slice(8,10))}日`;
 if(type==='day')return `${fmt(key)} · 周${'日一二三四五六'[parseDate(key).getDay()]}`;
 if(type==='month')return `${key.slice(0,4)}年${Number(key.slice(5,7))}月`;
 const end=moveDay(key,6);return `${fmt(key)}–${key.slice(0,7)===end.slice(0,7)?Number(end.slice(8,10))+'日':fmt(end)}`;
}
function dateFor(type,key){return type==='month'?key+'-01':key;}

 try{
  const [type,key,id]=location.hash.slice(1).split('/').map(decodeURIComponent);
  if(!Object.hasOwn(meta,type)||!validDate(dateFor(type,key??'')))return null;
  return {type,date:dateFor(type,key),id};
 }catch{return null;}
}

let activeNote=null;

function currentRecords(){
 const key=keyNow();
 if(type==='day')return data.day[key]??(data.day[key]=[emptyRecord(uid())]);
 return [data[type][key]??(data[type][key]=emptyRecord())];
}
function hasText(record){return Object.values(record.fields).some(value=>value.trim());}
function hasContent(record){return hasText(record)||record.links.length>0;}
function collect(){
 return Object.entries(data).flatMap(([kind,periods])=>Object.entries(periods).flatMap(([key,value])=>
  (kind==='day'?value:[value]).filter(hasContent).map(record=>{
   const text=fieldsFor(kind).map(([name])=>record.fields[name]).find(s=>s?.trim());
   return {type:kind,key,record,ref:reference(kind,key,record.id),title:short(text||'关联笔记'),date:dateFor(kind,key)};
  }))).sort((a,b)=>b.date.localeCompare(a.date)||+b.record.highlight-+a.record.highlight);
}
function getRecord(ref){

}
function save(){

   const picked=current?.links.includes(item.ref);
   const limit=kind==='week'&&!picked&&focus.length>=3;
   const label=kind==='week'?(picked?'已选':'选为重点'):kind==='month'?(picked?'已添加':'添加'):(picked?'已联结':'联结');
   return `<div class="pick-row">${recordLink(item,focus.includes(item.ref))}${source?`<button class="button${picked?'':' primary'}" data-pick="${escapeHtml(item.ref)}" aria-pressed="${picked}" ${limit?'disabled':''}>${label}</button>`:''}</div>`;
  }).join(''):`<p class="empty">${kind==='week'?'没有符合筛选的本周日记。':'这里还没有符合条件的记录。'}</p>`;
 }
 search.addEventListener('input',update);
 [stars,same].filter(Boolean).forEach(button=>button.addEventListener('click',()=>{button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true');update();}));
 $('picker-list').addEventListener('click',event=>{
  const button=event.target.closest('[data-pick]');
  if(!button||!current)return;
  const ref=button.dataset.pick;
  if(!getRecord(ref)||ref===source)return;
  const picked=current.links.includes(ref);
  if(picked)removeReference(current,ref);
  else current.links.push(ref);
  save();renderEditor();renderCount();update();
  [...$('picker-list').querySelectorAll('[data-pick]')].find(item=>item.dataset.pick===ref)?.focus();
 });
 update();
}
$('brand-icon').innerHTML=icon('book');$('close-dialog').innerHTML=icon('close');
$('close-dialog').addEventListener('click',()=>dialog.close());
$('view-switch').addEventListener('click',event=>{
 const button=event.target.closest('[data-view]');
 if(button)setView(button.dataset.view);
});
$('help').addEventListener('click',()=>openDialog('怎么写',guideContent()));
$('periods').addEventListener('click',event=>{
 const button=event.target.closest('[data-period]');
 if(!button)return;
 if(button.dataset.period==='archive'){
  currentView='archive';history.replaceState(null,'',location.pathname+location.search);render();
 }else navigate(button.dataset.period,date);
 $('periods').querySelector('[aria-current=true]').focus({preventScroll:true});
 window.scrollTo(0,0);
});
$('date-controls').addEventListener('click',event=>{
 const action=event.target.closest('button')?.dataset.action;
 if(action==='previous'||action==='next'){movePeriod(action==='previous'?-1:1);$('date-controls').querySelector('[data-action='+action+']').focus();}
 if(action==='date'){
  openDialog('选择日期',`<form class="date-form"><input type="date" aria-label="日期" value="${date}" required><button class="button primary">前往</button><button type="button" class="button" id="go-today">回到今天</button></form>`);
  dialog.querySelector('form').addEventListener('submit',submission=>{
   submission.preventDefault();const value=dialog.querySelector('input').value;
   if(validDate(value)){dialog.close();navigate(type,value);$('date-controls').querySelector('[data-action=date]').focus();}
  });
  $('go-today').addEventListener('click',()=>{dialog.close();navigate(type,currentDate());$('date-controls').querySelector('[data-action=date]').focus();});
 }
});
$('editor').addEventListener('input',event=>{
 if(event.target.id==='archive-query'){archiveQuery=event.target.value;renderArchiveItems();return;}
 const field=event.target.dataset.field;
 if(!field)return;
 const article=event.target.closest('[data-record]');
 getRecord(article.dataset.record).fields[field]=event.target.value;
 save();renderCount();
 if($('draft-status'))$('draft-status').textContent=storageError?'当前浏览器暂时无法保存':'草稿已保存';
});
$('editor').addEventListener('change',event=>{
 if(event.target.id!=='deep-step'||activeNote?.mode!=='deep')return;
 activeNote.step=Number(event.target.value);
 renderEditor();$('deep-step').focus();
});
$('editor').addEventListener('submit',event=>{
 const form=event.target.closest('[data-pair-form]');
 if(!form)return;
 event.preventDefault();
 const record=getRecord(form.closest('[data-record]').dataset.record);
 const choices=new FormData(form);
 const from=choices.get('from'), to=choices.get('to');
 if(!from||!to)return;
 if(from===to){notify('请选择两条不同的片段');return;}
 const connections=record.connections??(record.connections=[]);
 if(connections.some(pair=>pair[0]===from&&pair[1]===to)){notify('这个方向的箭头已经添加');return;}
 connections.push([from,to]);
 save();renderEditor();$('editor').querySelector('[data-pair-form] select')?.focus();
 notify('已添加联结箭头');
});
$('editor').addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const action=button.dataset.action;
 const article=button.closest('[data-record]'),ref=article?.dataset.record;
 const record=ref?getRecord(ref):null;
 if(action==='archive-filter'||action==='archive-stars'){
  if(action==='archive-stars'){
   archiveStars=!archiveStars;
   button.setAttribute('aria-pressed',archiveStars);
  }else{
   archiveFilter=button.dataset.filter;
   $('editor').querySelectorAll('[data-filter]').forEach(item=>item.setAttribute('aria-pressed',item===button));
  }
  renderArchiveItems();return;
 }
 if(action==='open-note'){
  const index=Number(button.dataset.index);
  openDayNote(index);
  return;
 }
 if(action==='open-overview'){setView('overview');$('overview-title').focus();return;}
 if(action==='back-to-board'){setView('edit');$('editor').querySelector('[data-action=open-note]')?.focus();return;}
 if(action==='close-note'){
  const index=activeNote.index;
  if(activeNote.mode!=='write'){activeNote.mode='write';renderEditor();$('editor').querySelector('[data-action=deep-note]')?.focus();return;}
  activeNote=null;renderEditor();focusDayNote(index);return;
 }
 if(action==='start-writing'){
  setView('edit');
  if(type==='day')openDayNote(0);
  else $('editor').querySelector('.step-open')?.focus();
  return;
 }
 if(action==='save'){save();setView('overview',{focus:true});$('view-switch').scrollIntoView({block:'nearest'});notify(storageError?'当前浏览器无法保存':'已保存'+meta[type].label);return;}
 if(!record)return;
 if(action==='finish-note'){
  const writing=activeNote.mode==='write';
  if(writing&&!record.fields.event?.trim()&&!hasContent(record)){
   notify('写下一句你想记住的事');article.querySelector('textarea').focus();return;
  }
  const index=activeNote.index;
  activeNote=null;save();renderEditor();renderCount();focusDayNote(index);
  notify(storageError?'当前浏览器无法保存':writing?'已记下这一条':'回看已保存');
 }else if(action==='reflect-note'){
  activeNote.mode='reflect';renderEditor();$('editor').querySelector('.composer-panel [data-lens]')?.focus();
 }else if(action==='deep-note'||action==='deep-next'){
  activeNote.step=action==='deep-note'?0:activeNote.step+1;
  activeNote.mode='deep';renderEditor();$('deep-step').focus();
 }else if(action==='step'){
  const index=Number(button.dataset.index);
  activeStep=activeStep===index&&!summaryLens?-1:index;
  summaryLens=false;renderEditor();
  $('editor').querySelector(`.step-open[data-index="${index}"]`)?.focus();
 }else if(action==='highlight'){
  if(!record.highlight&&!hasContent(record)){notify('先写下内容，再标记高亮');return;}
  record.highlight=!record.highlight;save();
  article.classList.toggle('is-highlight',record.highlight);button.setAttribute('aria-pressed',record.highlight);
  const label=record.highlight?'取消高亮':'标记高亮';button.setAttribute('aria-label',label);button.title=label;
  notify(record.highlight?'已标记高亮':'已取消高亮');
 }else if(action==='perspective'){
  summaryLens=!summaryLens;renderEditor();
  $('editor').querySelector(summaryLens?'[data-lens]':'[data-action=perspective]')?.focus();
 }else if(action==='lens'){
  record.perspective=button.dataset.lens;save();
  const panel=article.querySelector('[data-perspective]');
  panel.querySelectorAll('[data-lens]').forEach(lens=>lens.setAttribute('aria-pressed',lens===button));
  panel.querySelector('.prompt').textContent=perspectives.find(([id])=>id===record.perspective)[2];
 }else if(action==='link'){
  picker(ref);
 }else if(action==='unlink'){
  removeReference(record,button.dataset.link);save();renderEditor();renderCount();
  document.getElementById('entry-'+ref)?.querySelector('[data-action=link]')?.focus();notify(type==='month'?'已移除参考记录':'已移除该记录');
 }else if(action==='remove-pair'){
  record.connections=record.connections.filter(([from,to])=>from!==button.dataset.from||to!==button.dataset.to);
  save();renderEditor();$('editor').querySelector('[data-pair-form] select')?.focus();notify('已移除箭头');
 }else if(action==='delete'){
  if(hasContent(record)&&!confirm('删除这条记录？引用它的联结会一并移除。'))return;
  data.day[keyNow()]=currentRecords().filter(entry=>entry!==record);
  for(const periods of Object.values(data))for(const value of Object.values(periods)){
   for(const entry of Array.isArray(value)?value:[value])removeReference(entry,ref);
  }
  const index=activeNote?.index??0;
  activeNote=null;save();renderEditor();renderCount();focusDayNote(Math.min(index,Math.max(2,currentRecords().length-1)));
 }
});
document.addEventListener('click',event=>{
 const anchor=event.target.closest('a[data-ref]');
 if(!anchor||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();if(dialog.open)dialog.close();jump(anchor.dataset.ref);
});
window.addEventListener('popstate',()=>{const state=locationState();if(state)jump(reference(state.type,periodKey(state.type,state.date),state.id),{fromHash:true});else navigate('day',currentDate());});
window.addEventListener('storage',event=>{
 if(event.key!==KEY||!event.newValue)return;
 try{data=JSON.parse(event.newValue);render();}catch{}
});
if(locationState())jump(reference(type,keyNow(),focusId),{fromHash:true});else render();
</script>
