<style>

.view-switch{display:flex;gap:6px;margin:0 0 13px}.view-switch .button[aria-pressed=true]{color:var(--purple);border-color:#daccec;background:var(--soft)}

.week-selection{margin-bottom:10px}.week-selection .section-copy{margin-bottom:6px}.week-connections{margin:12px 0 0}.week-connections h4{margin:0 0 6px;font-size:.9rem}.week-connections p{margin-bottom:8px}.pair-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}.pair-field{font-size:.83rem;color:var(--muted);min-width:0}.pair-field select{display:block;width:100%;min-height:44px;margin-top:4px;padding:7px;border:1px solid var(--line);border-radius:8px;background:#f9f7fc;font-family:inherit;font-size:1rem;color:var(--ink)}.connections-list{display:grid;gap:6px;margin:8px 0}.pair-row{display:flex;align-items:center;gap:6px;min-width:0}.pair-row .link{flex:1}.pair-row>.icon{width:15px;height:15px;color:var(--purple)}

.overview-header h2{font-size:1.24rem}.overview-header span{color:var(--muted);font-size:.85rem}
.overview-body{padding-top:16px}.overview-blank p{margin:0 0 12px}

.read-section h4{margin:0 0 2px;font-size:.85rem;color:#544166}.read-section p{white-space:pre-wrap;font-size:.95rem}.read-section p.empty{font-size:.83rem}

.read-week{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:17px}.read-week .calendar{min-width:0;border-left:1px solid var(--line);padding-left:16px}.read-week .calendar .read-source:first-child{border-top:0;padding-top:0;margin-top:0}
.read-month{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.read-month .read-section{margin:0}

<body>
<header><div class="top wrap"><div class="brand"><span class="brand-icon" id="brand-icon"></span>复盘笔记</div><div class="top-actions"><button class="button" id="history">历史</button><button class="button" id="help">怎么写</button></div></div></header>
<main class="wrap">
<section class="hero" aria-labelledby="title">
  <div class="hero-copy"><h1 id="title"></h1><p id="hero-prompt"></p></div>
  <svg class="orbit" viewBox="0 0 290 190" fill="none" aria-hidden="true">
    <ellipse cx="151" cy="98" rx="105" ry="34" transform="rotate(-26 151 98)" stroke="currentColor" stroke-width="1.1"/>
    <ellipse cx="151" cy="98" rx="105" ry="34" transform="rotate(29 151 98)" stroke="currentColor" stroke-width="1.1"/>
    <circle cx="151" cy="98" r="49" stroke="#7e64ad"/>
    <circle cx="151" cy="98" r="30" fill="#6a509a"/>
    <path d="M151 75c2 15 8 21 23 23-15 2-21 8-23 23-2-15-8-21-23-23 15-2 21-8 23-23Z" fill="#f3df9d"/>
    <circle cx="75" cy="58" r="4" fill="#d9c4ff"/><circle cx="234" cy="60" r="4" fill="#f3df9d"/><circle cx="220" cy="147" r="4" fill="#bca7e5"/>
    <path d="M47 117v14m-7-7h14m196-11v16m-8-8h16" stroke="#c8b2eb" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <div class="hero-count" id="hero-count"></div>
</section>
<nav class="periods" aria-label="复盘周期" id="periods"></nav>
<div class="columns">
  <section class="work" aria-label="复盘内容">
    <div class="datebar"><div class="date-title"><h2 id="date-label"></h2><span class="today" id="today"></span></div><div class="date-controls" id="date-controls"></div></div>
    <div class="view-switch" id="view-switch" role="group" aria-label="复盘视图">
      <button class="button" type="button" data-view="edit" aria-pressed="true">填写</button>
      <button class="button" type="button" data-view="overview" aria-pressed="false">复盘总览</button>
    </div>
    <div id="editor"></div>
  </section>
  <aside class="side">
    <details class="card guide" id="guide"><summary id="guide-title"></summary><div id="guide-content"></div></details>
    <section class="card threads"><h2 id="threads-title"></h2><div id="highlights"></div></section>
    <p class="preserve" id="save-state" role="status"></p>
  </aside>
</div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button bare" id="close-dialog" aria-label="关闭"></button></div><div class="dialog-inner" id="dialog-inner"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const icons={
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5zm0 12A2.5 2.5 0 0 1 6.5 15H20M9 7h6m-6 4h4"/>',
 day:'<path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
 week:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18m-13 5h1m3 0h1m3 0h1"/>',
 month:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 4v16M4 12h16"/>',
 back:'<path d="m15 6-6 6 6 6"/>',next:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
 star:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 spark:'<path d="M12 2c.7 6.4 3.6 9.3 10 10-6.4.7-9.3 3.6-10 10-.7-6.4-3.6-9.3-10-10 6.4-.7 9.3-3.6 10-10Z"/>',
 link:'<path d="m10 13 4-4m-5 7-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0m3 0 1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',
 lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/>',
 check:'<path d="m5 12 4 4L19 6"/>', arrow:'<path d="M3 12h17m-6-6 6 6-6 6"/>'
};
const icon=(name,extra='')=>`<svg class="icon ${extra}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const short=(s,n=52)=>{const t=String(s??'').trim().replace(/\s+/g,' ');return t.length>n?t.slice(0,n)+'…':t;};
const meta={
 day:{label:'日复盘',title:'每日复盘',prompt:'今天，哪件事让你心里动了一下？',guides:['选一件有感触的事，先分开记录事实和当时的想法、感受。','如果当时采取了行动，也可以补记行动和结果。','回看这件事，试着换个角度，再想想现在可以做什么。行动有了结果再回来补。']},
 week:{label:'周复盘',title:'每周复盘',prompt:'从一周的记录里找线索，想清楚下一步。',guides:['平时可以在日复盘里简记每天 3 件有感触的事，各加一句感受或发现。','周末从本周日记挑出最重要的 3 条，用箭头标出看见的联结。','用一句话归纳它们让你看见了什么，比如自己的状态、在意的事或长处。','把自己想试的事写具体，包括何时、何地、和谁、做什么，必要时记下预算。']},
 month:{label:'月复盘',title:'每月复盘',prompt:'这个月，我有了哪些发现、尝试和收获？',guides:['回看本月的记录，从内面、行动、结果各自挑出 1–3 条重要内容。','内面写感受或新认识。行动写实际做过的事。结果写已经发生的变化。','三项可以来自不同的事，每条单独换行。']}
};
const dayCaptureFields=[
 ['event','发生了什么？','写当时能看见或听见的事实。','比如：晚饭后，我拿了两张早餐照片，孩子说想出题考我。'],
 ['feeling','当时想了什么、感受到什么？','写下那一刻的真实反应。','比如：原本有点累，听到他主动出题，我一下子来了兴趣。'],
 ['pastAction','当时做了什么？（可选）','','比如：我把手机递给他，让他挑要考我的照片。'],
 ['pastResult','当时有什么结果？（可选）','','比如：我们轮流出了四题。']

  });
  $('picker-list').innerHTML=list.length?list.map(item=>{
   const picked=current?.links.includes(item.ref);
   const limit=kind==='week'&&!picked&&focus.length>=3;
   const label=kind==='week'?(picked?'已选':'选为重点'):kind==='month'?(picked?'已添加':'添加'):(picked?'已联结':'联结');
   return `<div class="pick-row">${recordLink(item,focus.includes(item.ref))}${source?`<button class="button${picked?'':' primary'}" data-pick="${escapeHtml(item.ref)}" aria-pressed="${picked}" ${limit?'disabled':''}>${label}</button>`:''}</div>`;
  }).join(''):`<p class="empty">${kind==='week'?'没有符合筛选的本周日记。':'这里还没有符合条件的记录。'}</p>`;
 }
 search.addEventListener('input',update);
 [stars,same].filter(Boolean).forEach(button=>button.addEventListener('click',()=>{button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true');update();}));
 $('picker-list').addEventListener('click',event=>{
  const button=event.target.closest('[data-pick]');
  if(!button||!current)return;
  const ref=button.dataset.pick;
  if(!getRecord(ref)||ref===source)return;
  const picked=current.links.includes(ref);
  if(picked)removeReference(current,ref);
  else current.links.push(ref);
  save();renderEditor();renderCount();update();
  [...$('picker-list').querySelectorAll('[data-pick]')].find(item=>item.dataset.pick===ref)?.focus();
 });
 update();
}
$('brand-icon').innerHTML=icon('book');$('close-dialog').innerHTML=icon('close');
$('close-dialog').addEventListener('click',()=>dialog.close());
$('history').addEventListener('click',()=>picker());
$('view-switch').addEventListener('click',event=>{
 const button=event.target.closest('[data-view]');
 if(button)setView(button.dataset.view);
});
$('help').addEventListener('click',()=>{$('guide').open=true;$('guide-title').focus({preventScroll:true});$('guide').scrollIntoView({block:'center'});});
if(matchMedia('(min-width: 721px)').matches)$('guide').open=true;
$('periods').addEventListener('click',event=>{const button=event.target.closest('[data-period]');if(button){navigate(button.dataset.period,date);$('periods').querySelector('[aria-current=true]').focus();}});
$('date-controls').addEventListener('click',event=>{
 const action=event.target.closest('button')?.dataset.action;
 if(action==='previous'||action==='next'){movePeriod(action==='previous'?-1:1);$('date-controls').querySelector('[data-action='+action+']').focus();}
 if(action==='date'){
  openDialog('选择日期',`<form class="date-form"><input type="date" aria-label="日期" value="${date}" required><button class="button primary">前往</button><button type="button" class="button" id="go-today">回到今天</button></form>`);
  dialog.querySelector('form').addEventListener('submit',submission=>{
   submission.preventDefault();const value=dialog.querySelector('input').value;
   if(validDate(value)){dialog.close();navigate(type,value);$('date-controls').querySelector('[data-action=date]').focus();}
  });
  $('go-today').addEventListener('click',()=>{dialog.close();navigate(type,currentDate());$('date-controls').querySelector('[data-action=date]').focus();});
 }
});
$('editor').addEventListener('input',event=>{
 const field=event.target.dataset.field;
 if(!field)return;
 const article=event.target.closest('[data-record]');
 getRecord(article.dataset.record).fields[field]=event.target.value;
 save();renderCount();renderHighlights();
});
$('editor').addEventListener('submit',event=>{
 const form=event.target.closest('[data-pair-form]');
 if(!form)return;
 event.preventDefault();
 const record=getRecord(form.closest('[data-record]').dataset.record);
 const choices=new FormData(form);
 const from=choices.get('from'), to=choices.get('to');
 if(!from||!to)return;
 if(from===to){notify('请选择两条不同的片段');return;}
 const connections=record.connections??(record.connections=[]);
 if(connections.some(pair=>pair[0]===from&&pair[1]===to)){notify('这个方向的箭头已经添加');return;}
 connections.push([from,to]);
 save();renderEditor();$('editor').querySelector('[data-pair-form] select')?.focus();
 notify('已添加联结箭头');
});
$('editor').addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const action=button.dataset.action;
 const article=button.closest('[data-record]'),ref=article?.dataset.record;
 const record=ref?getRecord(ref):null;
 if(action==='add'){
  const newRecord=emptyRecord(uid());currentRecords().push(newRecord);save();renderEditor();
  document.getElementById('entry-'+reference(type,keyNow(),newRecord.id)).querySelector('textarea').focus();return;
 }
 if(action==='start-writing'){setView('edit');$('editor').querySelector('textarea')?.focus();return;}
 if(action==='save'){save();setView('overview',{focus:true});$('view-switch').scrollIntoView({block:'nearest'});notify(storageError?'当前浏览器无法保存':'已保存'+meta[type].label);return;}
 if(!record)return;
 if(action==='highlight'){
  if(!record.highlight&&!hasContent(record)){notify('先写下内容，再标记高亮');article.querySelector('textarea').focus();return;}
  record.highlight=!record.highlight;save();renderHighlights();
  article.classList.toggle('is-highlight',record.highlight);button.setAttribute('aria-pressed',record.highlight);
  const label=record.highlight?'取消高亮':'标记高亮';button.setAttribute('aria-label',label);button.title=label;
  notify(record.highlight?'已标记高亮':'已取消高亮');
 }else if(action==='perspective'){
  const panel=article.querySelector('[data-perspective]');panel.hidden=!panel.hidden;
  if(panel.hidden)openPerspectives.delete(ref);else openPerspectives.add(ref);
  button.setAttribute('aria-expanded',!panel.hidden);
 }else if(action==='lens'){
  record.perspective=button.dataset.lens;save();
  const panel=article.querySelector('[data-perspective]');
  panel.querySelectorAll('[data-lens]').forEach(lens=>lens.setAttribute('aria-pressed',lens===button));
  panel.querySelector('.prompt').textContent=perspectives.find(([id])=>id===record.perspective)[2];
 }else if(action==='link'){
  picker(ref);
 }else if(action==='unlink'){
  removeReference(record,button.dataset.link);save();renderEditor();renderCount();renderHighlights();
  document.getElementById('entry-'+ref)?.querySelector('[data-action=link]')?.focus();notify(type==='month'?'已移除参考记录':'已移除该记录');
 }else if(action==='remove-pair'){
  record.connections=record.connections.filter(([from,to])=>from!==button.dataset.from||to!==button.dataset.to);
  save();renderEditor();$('editor').querySelector('[data-pair-form] select')?.focus();notify('已移除箭头');
 }else if(action==='delete'){
  if(hasContent(record)&&!confirm('删除这条记录？引用它的联结会一并移除。'))return;
  data.day[keyNow()]=currentRecords().filter(entry=>entry!==record);
  for(const periods of Object.values(data))for(const value of Object.values(periods)){
   for(const entry of Array.isArray(value)?value:[value])removeReference(entry,ref);
  }
  openPerspectives.delete(ref);save();renderEditor();renderCount();renderHighlights();$('editor').querySelector('[data-action=add]').focus();
 }
});
document.addEventListener('click',event=>{
 const anchor=event.target.closest('a[data-ref]');
 if(!anchor||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();if(dialog.open)dialog.close();jump(anchor.dataset.ref);
});
window.addEventListener('popstate',()=>{const state=locationState();if(state)jump(reference(state.type,periodKey(state.type,state.date),state.id),{fromHash:true});else navigate('day',currentDate());});
window.addEventListener('storage',event=>{
 if(event.key!==KEY||!event.newValue)return;
 try{data=JSON.parse(event.newValue);render();}catch{}
});
if(locationState())jump(reference(type,keyNow(),focusId),{fromHash:true});else render();
</script>
